# Automatic prerelease publishing: after every GREEN ci run on main,
# PACKAGE the archives from the binaries that ci run built and tested
# (no rebuild) and attach them to a prerelease keyed by the commit: tag
# dev-<sha12>, created at exactly that commit. Triggering on ci's
# completion rather than on push does two things at once: nothing is
# ever published from a red commit, and only ci-tested bytes are ever
# shipped.
#
# The packaging path deliberately runs on the PLAIN runner, no toolchain
# container: it compiles nothing, and the one cross-arch tool it needs,
# stripping foreign-ELF binaries, is llvm-strip, which handles every
# target from the stock image. Only the manual-dispatch fallback (a full
# tools/make-release.sh rebuild, for when there is no ci run to reuse)
# still runs in the zig image.
#
# These dev-* prereleases are disposable by design; release-cleanup.yml
# deletes them (and their anchor tags) after 90 days. Real releases are
# hand-tagged v* and never touched by any of this.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  actions: read  # download the triggering ci run's bench-report artifacts

jobs:
  prerelease:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      # The archives are PACKAGED from the binaries the triggering ci run
      # built and tested, never rebuilt.
      - name: Collect binaries from the ci run
        uses: actions/download-artifact@v8
        with:
          # static-binaries-* (linux musl), tool-binaries-* (windows,
          # macos, wasm)
          pattern: "*-binaries-*"
          path: ci-binaries
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package the archives
        run: |
          VERSION=$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt)
          mkdir -p release

          # llvm-strip handles every ELF target from the stock runner:
          # the whole reason this job needs no toolchain container. If
          # the image ever drops it, foreign-arch binaries ship
          # unstripped with a warning rather than failing the release.
          STRIP=""
          for c in llvm-strip llvm-strip-20 llvm-strip-19 llvm-strip-18; do
            if command -v "$c" > /dev/null 2>&1; then STRIP="$c"; break; fi
          done
          [ -n "$STRIP" ] || echo "::warning::no llvm-strip on runner; shipping unstripped linux binaries"

          for arch in x86_64 aarch64 riscv64 ppc64le s390x; do
            src="ci-binaries/static-binaries-${arch}"
            if [ ! -d "$src" ]; then
              echo "::error::ci run produced no ${arch} static binaries"
              exit 1
            fi
            pkg="blake3pp-${VERSION}-linux-${arch}-static"
            stage="release/${pkg}"
            mkdir -p "$stage"
            cp "$src"/cli/blake3ppsum "$src"/cli/blake3ppgen \
               "$src"/bench/blake3pp_bench "$src"/bench/blake3pp_bench_file \
               "$stage"/
            chmod +x "$stage"/*
            [ -z "$STRIP" ] || "$STRIP" "$stage"/*
            cp README.md "$stage"/
            tar -C release -czf "release/${pkg}.tar.gz" "$pkg"
            rm -rf "$stage"
          done

          # macOS (appleclang, tested natively on the Apple-silicon
          # runner; already stripped there, since GNU/LLVM ELF strippers
          # are not for Mach-O).
          src="ci-binaries/tool-binaries-macos-arm64"
          if [ ! -d "$src" ]; then
            echo "::error::ci run produced no macos binaries"; exit 1
          fi
          pkg="blake3pp-${VERSION}-macos-arm64"
          stage="release/${pkg}"
          mkdir -p "$stage"
          cp "$src"/cli/blake3ppsum "$src"/cli/blake3ppgen \
             "$src"/bench/blake3pp_bench "$src"/bench/blake3pp_bench_file \
             "$stage"/
          chmod +x "$stage"/*
          cp README.md "$stage"/
          tar -C release -czf "release/${pkg}.tar.gz" "$pkg"
          rm -rf "$stage"

          # WebAssembly: node-runnable js+wasm pairs, SIMD128 kernel with
          # runtime dispatch to scalar where wasm SIMD is unavailable.
          src="ci-binaries/tool-binaries-wasm32"
          if [ ! -d "$src" ]; then
            echo "::error::ci run produced no wasm binaries"; exit 1
          fi
          pkg="blake3pp-${VERSION}-wasm32-simd128"
          stage="release/${pkg}"
          mkdir -p "$stage"
          cp "$src"/cli/*.js "$src"/cli/*.wasm \
             "$src"/bench/*.js "$src"/bench/*.wasm "$stage"/
          cp README.md "$stage"/
          printf 'Run with node >= 16 (SIMD on by default):\n  node blake3ppsum.js -- --help\n' > "$stage"/RUNNING.txt
          tar -C release -czf "release/${pkg}.tar.gz" "$pkg"
          rm -rf "$stage"

          # Windows (zip is the platform convention): both compilers on
          # both architectures. x64 is tested natively on the build
          # runner; arm64 is cross-built (tested natively when the
          # windows-11-arm lane is enabled, and flagged in the notes).
          for pair in \
            "windows-msvc2026-cxx23:windows-x86_64-msvc" \
            "windows-clangcl-cxx23:windows-x86_64-clangcl" \
            "windows-arm64-msvc2026-cxx23:windows-arm64-msvc" \
            "windows-arm64-clangcl-cxx23:windows-arm64-clangcl"; do
            preset="${pair%%:*}"
            name="${pair#*:}"
            src="ci-binaries/tool-binaries-${preset}"
            if [ ! -d "$src" ]; then
              echo "::error::ci run produced no ${name} binaries"; exit 1
            fi
            pkg="blake3pp-${VERSION}-${name}"
            stage="release/${pkg}"
            mkdir -p "$stage"
            cp "$src"/cli/*.exe "$src"/bench/*.exe "$stage"/
            cp README.md "$stage"/
            (cd release && python3 -m zipfile -c "${pkg}.zip" "${pkg}")
            rm -rf "$stage"
          done

          ls -la release

      # POSIX substring, not ${VAR:0:12}: container steps default to
      # sh/dash where that bashism dies with "Bad substitution" (it took
      # a release run down); `cut` never surprises anyone.
      - name: Compute release identity
        id: ident
        run: |
          short=$(printf %s "$RELEASE_SHA" | cut -c1-12)
          echo "tag=dev-${short}" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"

      # The hardware test+bench reports the ci run produced. Whatever
      # subset exists gets appended to the release notes.
      - name: Collect hardware bench reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: bench-report-*
          path: bench-reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose release notes
        run: |
          {
            echo "Automated prerelease of commit ${RELEASE_SHA} (ci green):"
            echo "every archive contains exactly the bytes that ci run tested."
            echo
            echo "Linux (fully static musl+mimalloc; \`blake3ppsum\`,"
            echo "\`blake3ppgen\`, benchmarks): x86_64 (SSE4.2 through AVX-512),"
            echo "aarch64 (full NEON+SVE chain), riscv64 (RVV/Zvbb chain),"
            echo "ppc64le (POWER VSX), s390x (z14 VXE, big-endian; both"
            echo "emulator-tested, no hardware lane yet); runtime"
            echo "dispatch throughout. Plus"
            echo "windows-x86_64 in both compilers (msvc and clang-cl;"
            echo "clang-cl carries the faster byte-rotate kernels;"
            echo "IOCP+direct I/O in both), macos-arm64 (Apple clang,"
            echo "GCD + F_NOCACHE I/O), wasm32-simd128 (node-runnable"
            echo "js+wasm, SIMD128 kernel), and windows-arm64 in both"
            echo "compilers (cross-built; tested natively only when the"
            echo "ci run's windows-11-arm lane was enabled; check its"
            echo "jobs)."
            echo "Disposable: swept by release-cleanup after 90 days."
            if ls bench-reports/*/bench-report.txt > /dev/null 2>&1; then
              echo
              echo "## Hardware test & bench reports (from the triggering ci run)"
              echo "_Shared-runner numbers are indicative ratios, not measurements._"
              for f in bench-reports/*/bench-report.txt; do
                echo
                echo '```'
                cat "$f"
                echo '```'
              done
            fi
          } > release-notes.md

      # Two-phase publish: this repo has IMMUTABLE releases, which forbid
      # attaching assets after publication, yet the action publishes
      # before uploading. Create a DRAFT (drafts stay mutable), let the
      # assets land in it, then flip it live in the next step.
      - name: Create draft prerelease with assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ident.outputs.tag }}
          target_commitish: ${{ env.RELEASE_SHA }}
          name: dev build ${{ steps.ident.outputs.short }}
          prerelease: true
          draft: true
          files: |
            release/*.tar.gz
            release/*.zip
          body_path: release-notes.md

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.ident.outputs.tag }}" --draft=false --prerelease --repo "$GITHUB_REPOSITORY"

  # ----- manual fallback: no ci run to reuse, full rebuild in the zig
  # image, the one path that still needs a toolchain container. The
  # image is pulled by CONTENT tag (same scheme as ci.yml) so the build
  # matches its commit's docker/ tree.
  ident:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=tree-$(bash tools/toolchain-image-tag.sh)" >> "$GITHUB_OUTPUT"

  manual-release:
    needs: ident
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}/toolchain-zig:${{ needs.ident.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          cache-prefix: hfc-src2-linux-
      - name: Full release build
        run: sh tools/make-release.sh
      - name: Compute release identity
        id: ident
        run: |
          short=$(git rev-parse HEAD | cut -c1-12)
          echo "tag=dev-${short}" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
      # Same two-phase dance as the prerelease job: immutable releases
      # only accept assets while still a draft.
      - name: Create draft prerelease with assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ident.outputs.tag }}
          name: dev build ${{ steps.ident.outputs.short }} (manual rebuild)
          prerelease: true
          draft: true
          files: |
            release/*.tar.gz
            release/*.zip

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.ident.outputs.tag }}" --draft=false --prerelease --repo "$GITHUB_REPOSITORY"
