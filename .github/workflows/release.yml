# Automatic prerelease publishing: after every GREEN ci run on main,
# PACKAGE the static musl+mimalloc archives (x86_64/aarch64/riscv64) from
# the binaries that ci run built and tested (no rebuild) and attach
# them to a prerelease keyed by the commit: tag dev-<sha12>, created at
# exactly that commit. Triggering on ci's completion rather than on push
# does two things at once: nothing is ever published from a red commit,
# and only ci-tested bytes are ever shipped. Manual dispatch (no ci run
# to reuse) falls back to a full tools/make-release.sh build.
#
# These dev-* prereleases are disposable by design; release-cleanup.yml
# deletes them (and their anchor tags) after 90 days. Real releases are
# hand-tagged v* and never touched by any of this.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  actions: read  # download the triggering ci run's bench-report artifacts

jobs:
  # The zig image is pulled by CONTENT tag (same scheme as ci.yml) so the
  # release always builds in the image matching its commit's docker/ tree;
  # ci already guaranteed that tag exists for any green main commit.
  ident:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - id: tag
        run: echo "tag=tree-$(bash tools/toolchain-image-tag.sh)" >> "$GITHUB_OUTPUT"

  prerelease:
    needs: ident
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}/toolchain-zig:${{ needs.ident.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CMAKE_GENERATOR: Ninja
      # The commit being released: the ci run's head on workflow_run, the
      # current ref on manual dispatch.
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache hermetic dependencies
        uses: actions/cache@v4
        with:
          # Only the path-FREE content is cached: the *-src trees and the
          # shared sources store. The FetchContent subbuild dirs (and
          # hfc's own clone) embed absolute workspace paths in their
          # CMakeCache.txt, so a cache written under one mount poisons
          # every job with another (a native-runner cache at
          # /home/runner/... once killed all container jobs at /__w/...).
          # Excluded dirs regenerate in seconds; the key prefix was also
          # rotated (hfc-src-) so pre-fix poisoned entries can never be
          # restored.
          path: |
            thirdparty/cache
            !thirdparty/cache/hfc
            !thirdparty/cache/hfc.*
            !thirdparty/cache/*-subbuild
          key: hfc-src-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'tests/CMakeLists.txt', 'bench/CMakeLists.txt', 'cli/CMakeLists.txt') }}
          restore-keys: hfc-src-

      # The archives are PACKAGED from the binaries the triggering ci run
      # built and tested, never rebuilt. Manual dispatch has no ci run to
      # reuse, so it falls back to the full make-release.sh build.
      - name: Collect static binaries from the ci run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          pattern: static-binaries-*
          path: ci-binaries
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package the static archives
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            sh tools/make-release.sh
            exit 0
          fi
          VERSION=$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt)
          mkdir -p release
          for arch in x86_64 aarch64 riscv64; do
            src="ci-binaries/static-binaries-${arch}"
            if [ ! -d "$src" ]; then
              echo "::error::ci run produced no ${arch} static binaries"
              exit 1
            fi
            pkg="blake3pp-${VERSION}-linux-${arch}-static"
            stage="release/${pkg}"
            mkdir -p "$stage"
            cp "$src"/cli/blake3ppsum "$src"/cli/blake3ppgen \
               "$src"/bench/blake3pp_bench "$src"/bench/blake3pp_bench_file \
               "$stage"/
            chmod +x "$stage"/*
            case "$arch" in
              x86_64) strip "$stage"/* ;;
              *)      "${arch}-linux-gnu-strip" "$stage"/* ;;
            esac
            cp README.md "$stage"/
            tar -C release -czf "release/${pkg}.tar.gz" "$pkg"
            rm -rf "$stage"
          done
          ls -la release

      - name: Compute release identity
        id: ident
        run: |
          echo "tag=dev-${RELEASE_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "short=${RELEASE_SHA:0:12}" >> "$GITHUB_OUTPUT"

      # The hardware test+bench reports the ci run produced: x86_64 (the
      # runner itself), aarch64 (Neoverse N2), riscv64 (Cloud-V). Whatever
      # subset exists gets appended to the release notes.
      - name: Collect hardware bench reports
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: bench-report-*
          path: bench-reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose release notes
        run: |
          {
            echo "Automated prerelease of commit ${RELEASE_SHA} (ci green)."
            echo "Fully static musl+mimalloc tool builds (\`blake3ppsum\`,"
            echo "\`blake3ppgen\`, benchmarks) for x86_64, aarch64 and riscv64:"
            echo "the aarch64 archives carry the full NEON+SVE kernel chain,"
            echo "the riscv64 ones the RVV/Zvbb chain (both with runtime"
            echo "vector-length dispatch), and the x86_64 ones SSE4.2 through"
            echo "AVX-512. Disposable: swept by release-cleanup after 90 days."
            if ls bench-reports/*/bench-report.txt > /dev/null 2>&1; then
              echo
              echo "## Hardware test & bench reports (from the triggering ci run)"
              echo "_Shared-runner numbers are indicative ratios, not measurements._"
              for f in bench-reports/*/bench-report.txt; do
                echo
                echo '```'
                cat "$f"
                echo '```'
              done
            fi
          } > release-notes.md

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ident.outputs.tag }}
          target_commitish: ${{ env.RELEASE_SHA }}
          name: dev build ${{ steps.ident.outputs.short }}
          prerelease: true
          files: release/*.tar.gz
          body_path: release-notes.md
