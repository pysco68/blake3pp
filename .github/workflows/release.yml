# Automatic prerelease publishing: after every GREEN ci run on main,
# PACKAGE the archives from the binaries that ci run built and tested
# (no rebuild) and attach them to a prerelease keyed by the commit: tag
# dev-<sha12>, created at exactly that commit. Triggering on ci's
# completion rather than on push does two things at once: nothing is
# ever published from a red commit, and only ci-tested bytes are ever
# shipped.
#
# The packaging path deliberately runs on the PLAIN runner, no toolchain
# container: it compiles nothing, and the one cross-arch tool it needs,
# stripping foreign-ELF binaries, is llvm-strip, which handles every
# target from the stock image. Only the manual-dispatch fallback (a full
# tools/make-release.sh rebuild, for when there is no ci run to reuse)
# still runs in the zig image.
#
# These dev-* prereleases are disposable by design; release-cleanup.yml
# deletes them (and their anchor tags) after 90 days. Real releases are
# hand-tagged v* and never touched by any of this.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  actions: read  # download the triggering ci run's bench-report and coverage artifacts

jobs:
  prerelease:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      # The archives are PACKAGED from the binaries the triggering ci run
      # built and tested, never rebuilt.
      - name: Collect binaries from the ci run
        uses: actions/download-artifact@v8
        with:
          # static-binaries-* (linux musl), tool-binaries-* (windows,
          # macos, wasm)
          pattern: "*-binaries-*"
          path: ci-binaries
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package the archives
        run: |
          VERSION=$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt)
          mkdir -p release

          # llvm-strip handles every ELF target from the stock runner:
          # the whole reason this job needs no toolchain container. If
          # the image ever drops it, foreign-arch binaries ship
          # unstripped with a warning rather than failing the release.
          STRIP=""
          for c in llvm-strip llvm-strip-20 llvm-strip-19 llvm-strip-18; do
            if command -v "$c" > /dev/null 2>&1; then STRIP="$c"; break; fi
          done
          [ -n "$STRIP" ] || echo "::warning::no llvm-strip on runner; shipping unstripped linux binaries"

          for arch in x86_64 aarch64 riscv64 ppc64le s390x; do
            src="ci-binaries/static-binaries-${arch}"
            if [ ! -d "$src" ]; then
              echo "::error::ci run produced no ${arch} static binaries"
              exit 1
            fi
            pkg="blake3pp-${VERSION}-linux-${arch}-static"
            stage="release/${pkg}"
            mkdir -p "$stage"
            cp "$src"/cli/blake3ppsum "$src"/cli/blake3ppgen \
               "$src"/bench/blake3pp_bench "$src"/bench/blake3pp_bench_file \
               "$stage"/
            chmod +x "$stage"/*
            [ -z "$STRIP" ] || "$STRIP" "$stage"/*
            cp README.md "$stage"/
            tar -C release -czf "release/${pkg}.tar.gz" "$pkg"
            rm -rf "$stage"
          done

          # macOS (appleclang, tested natively on the Apple-silicon
          # runner; already stripped there, since GNU/LLVM ELF strippers
          # are not for Mach-O).
          src="ci-binaries/tool-binaries-macos-arm64"
          if [ ! -d "$src" ]; then
            echo "::error::ci run produced no macos binaries"; exit 1
          fi
          pkg="blake3pp-${VERSION}-macos-arm64"
          stage="release/${pkg}"
          mkdir -p "$stage"
          cp "$src"/cli/blake3ppsum "$src"/cli/blake3ppgen \
             "$src"/bench/blake3pp_bench "$src"/bench/blake3pp_bench_file \
             "$stage"/
          chmod +x "$stage"/*
          cp README.md "$stage"/
          tar -C release -czf "release/${pkg}.tar.gz" "$pkg"
          rm -rf "$stage"

          # WebAssembly: the node-runnable js+wasm pairs and the browser
          # module (an ES module plus its .wasm), all with the SIMD128
          # kernel, which a wasm engine either has or refuses the module.
          src="ci-binaries/tool-binaries-wasm32"
          if [ ! -d "$src" ]; then
            echo "::error::ci run produced no wasm binaries"; exit 1
          fi
          pkg="blake3pp-${VERSION}-wasm32-simd128"
          stage="release/${pkg}"
          mkdir -p "$stage"
          cp "$src"/cli/*.js "$src"/cli/*.wasm \
             "$src"/bench/*.js "$src"/bench/*.wasm \
             "$src"/web/*.mjs "$src"/web/*.wasm "$stage"/
          cp README.md "$stage"/
          printf 'Run with node >= 16 (SIMD on by default):\n  node blake3ppsum.js -- --help\nThe browser module (README, "The wasm build"):\n  import createBlake3pp from "./blake3pp-web-simd128.mjs"\n' > "$stage"/RUNNING.txt
          tar -C release -czf "release/${pkg}.tar.gz" "$pkg"
          rm -rf "$stage"

          # Windows (zip is the platform convention), clang-cl only:
          # what cl produces is both slower to build and slower to run
          # (the kernel translation unit costs 15-20x the compile time,
          # and the shipped binary hashes at roughly half the rate), so
          # the MSVC presets are a conformance lane rather than a
          # release artifact. x64 is tested natively on the build
          # runner; arm64 is cross-built (tested natively when the
          # windows-11-arm lane is enabled, and flagged in the notes).
          for pair in \
            "windows-clangcl-cxx23:windows-x86_64-clangcl" \
            "windows-arm64-clangcl-cxx23:windows-arm64-clangcl"; do
            preset="${pair%%:*}"
            name="${pair#*:}"
            src="ci-binaries/tool-binaries-${preset}"
            if [ ! -d "$src" ]; then
              echo "::error::ci run produced no ${name} binaries"; exit 1
            fi
            pkg="blake3pp-${VERSION}-${name}"
            stage="release/${pkg}"
            mkdir -p "$stage"
            cp "$src"/cli/*.exe "$src"/bench/*.exe "$stage"/
            cp README.md "$stage"/
            (cd release && python3 -m zipfile -c "${pkg}.zip" "${pkg}")
            rm -rf "$stage"
          done

          ls -la release

      # POSIX substring, not ${VAR:0:12}: container steps default to
      # sh/dash where that bashism dies with "Bad substitution" (it took
      # a release run down); `cut` never surprises anyone.
      # Whether the ci run built on environment files it injected (their
      # committed versions lagged the image tag): such a build is marked
      # in the release name and notes.
      - name: Collect the environment-files record
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: toolchain-environments
          path: toolchain-environments
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute release identity
        id: ident
        run: |
          short=$(printf %s "$RELEASE_SHA" | cut -c1-12)
          echo "tag=dev-${short}" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
          suffix=""
          if grep -qs '^stale=true' toolchain-environments/toolchain-environments.txt; then
            suffix=" (dirty: uncommitted environment files)"
          fi
          echo "suffix=${suffix}" >> "$GITHUB_OUTPUT"

      # The hardware test+bench reports the ci run produced. Whatever
      # subset exists gets appended to the release notes.
      - name: Collect hardware bench reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: bench-report-*
          path: bench-reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The coverage reports the ci run produced (coverage-<preset>:
      # summary.txt, coverage.lcov, html/). Each becomes a release asset,
      # and the notes get an overview table computed from the lcov files,
      # the one format both llvm-cov and gcovr write.
      - name: Collect coverage reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The cross-platform total: the gcov lanes (x86 and the four crosses
      # through their emulator matrices) merged into one tracefile. gcov
      # lanes only: llvm and gcov instrument different line sets, so a
      # union across the two would mix two definitions of "line"; the
      # clang lane keeps its own row. lcov's genhtml renders the merged
      # view from this checkout's sources.
      - name: Merge the gcov lanes
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends lcov > /dev/null
          args=(); lanes=()
          for d in coverage-reports/coverage-*/; do
            name=$(basename "$d")
            case "$name" in *clang*) continue ;; esac
            [ -f "${d}coverage.lcov" ] || continue
            args+=(-a "${d}coverage.lcov"); lanes+=("${name#coverage-}")
          done
          [ "${#args[@]}" -gt 0 ] || { echo "no gcov lanes to merge"; exit 0; }
          mkdir -p coverage-reports/coverage-merged-gcov
          lcov -q "${args[@]}" -o coverage-reports/coverage-merged-gcov/coverage.lcov \
            --ignore-errors unsupported,inconsistent
          printf '%s\n' "${lanes[@]}" > coverage-reports/coverage-merged-gcov/lanes.txt
          genhtml -q -o coverage-reports/coverage-merged-gcov/html \
            --ignore-errors unsupported,inconsistent,source \
            coverage-reports/coverage-merged-gcov/coverage.lcov
          lcov --summary coverage-reports/coverage-merged-gcov/coverage.lcov \
            --ignore-errors unsupported,inconsistent | tee coverage-reports/coverage-merged-gcov/summary.txt

      - name: Package the coverage reports
        run: |
          set -euo pipefail
          for d in coverage-reports/coverage-*/; do
            [ -f "${d}coverage.lcov" ] || continue
            name=$(basename "$d")
            tar -C coverage-reports -czf "release/blake3pp-${name}.tar.gz" "$name"
          done
          ls -la release/

      - name: Compose release notes
        run: |
          short=$(printf %s "$RELEASE_SHA" | cut -c1-12)
          tag="${{ steps.ident.outputs.tag }}"
          # lines / functions / branches from an lcov file: "hit/found (pct)"
          lcov_totals() {
            awk -F: '
              /^LF:/ {lf+=$2} /^LH:/ {lh+=$2}
              /^FNF:/ {ff+=$2} /^FNH:/ {fh+=$2}
              /^BRF:/ {bf+=$2} /^BRH:/ {bh+=$2}
              function cell(h, f) { return f ? sprintf("%.1f%% (%d/%d)", 100*h/f, h, f) : "n/a" }
              END { printf "%s|%s|%s\n", cell(lh, lf), cell(fh, ff), cell(bh, bf) }' "$1"
          }
          {
            printf 'Automated prerelease of commit `%s` - every archive contains exactly the bytes this [ci run](%s/%s/actions/runs/%s) built and tested. Disposable: swept by release-cleanup after 90 days.\n\n' \
              "$short" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "${{ github.event.workflow_run.id }}"
            if grep -qs '^stale=true' toolchain-environments/toolchain-environments.txt; then
              printf '**Dirty build.** The cmake-re environment files were injected with image tag `%s` (the committed files name `%s`); the checkout was not clean, and the version stamps say so. The PR `ci/toolchain-environments` brings the committed files up to date.\n\n' \
                "$(sed -n 's/^tag=//p' toolchain-environments/toolchain-environments.txt)" "$(sed -n 's/^canon=//p' toolchain-environments/toolchain-environments.txt)"
            fi
            # The heredoc is indented to satisfy the YAML block scalar;
            # sed strips exactly that indent back off.
            sed -e 's/^          //' << 'NOTES'
          Each archive ships `blake3ppsum`, `blake3ppgen`, and the benchmarks. All carry runtime SIMD dispatch: one binary, every listed kernel, the best one selected on the machine it runs on.

          | archive | platform | SIMD kernels | validated on |
          |---|---|---|---|
          | `linux-x86_64-static` | Linux x86_64, static musl+mimalloc | sse42 / avx2 / avx512 | runner silicon + Intel SDE |
          | `linux-aarch64-static` | Linux arm64, static | neon / sve256 / sve512 / sve2_128 | qemu SVE matrix; Neoverse N2 when the lane runs |
          | `linux-riscv64-static` | Linux riscv64, static | rvv128-512 (+Zvbb twins), xthead (RVV 0.7.1, GCC-built object) | qemu VLEN matrix; Cloud-V boards when the lane runs |
          | `linux-ppc64le-static` | Linux POWER, static | vsx (POWER9) | qemu only - no hardware lane yet |
          | `linux-s390x-static` | Linux IBM z, static, **big-endian** | vxe (z14, GCC-built object) | qemu only - no hardware lane yet |
          | `linux-mips64el-static` | Linux MIPS, static (glibc rather than musl; no glibc floor either way) | msa (MIPS64r5) | **qemu only, and no MSA hardware is reachable at all** |
          | `windows-x86_64-clangcl` | Windows x64 | sse42 / avx2 / avx512 | native runner; IOCP + direct I/O |
          | `windows-arm64-clangcl` | Windows arm64 (cross-built) | neon / sve256 / sve512 / sve2_128 | windows-11-arm runner when the lane runs |
          | `macos-arm64` | macOS Apple silicon | neon; GCD + F_NOCACHE I/O | native runner |
          | `wasm32-simd128` | node >= 16 (js+wasm pairs) and browsers (the `blake3pp-web-simd128` ES module) | simd128 | node on the runner |

          Notes:
          - The static Linux binaries have no glibc coupling and no dynamic loader - one file per architecture, runs on any distro.
          - The static binaries are built with zig (clang + musl - the easiest fully-static route). Two kernels exceed what that toolchain can express - LLVM never merged XTheadVector, and its s390x backend scalarizes the z14 vector ops - so the riscv64 and s390x archives link those two kernel objects from GCC instead.
          - `blake3ppsum --version` prints the compiled variants, the dispatch verdict for the running machine, and any variants the CPU supports that the build does not carry.
          NOTES
            if ls bench-reports/*/bench-report.txt > /dev/null 2>&1; then
              echo
              echo "## Hardware test & bench reports (from the triggering ci run)"
              echo "_Shared-runner numbers are indicative ratios, not measurements._"
              for f in bench-reports/*/bench-report.txt; do
                echo
                echo '<details><summary>'
                head -1 "$f" | sed 's/^== //; s/ ==$//'
                echo '</summary>'
                echo
                echo '```'
                cat "$f"
                echo '```'
                echo '</details>'
              done
            fi
            if ls coverage-reports/coverage-*/coverage.lcov > /dev/null 2>&1; then
              echo
              echo "## Test coverage (from the triggering ci run)"
              echo "_Library, headers and tools; dependencies, tests and benches excluded. Hardware-specific kernels count only where the lane's machine or emulator runs them; the merged row is the union over the gcov lanes (functions and branches are not comparable across compilers and are left per lane)._"
              echo
              echo "| lane | lines | functions | branches | report |"
              echo "|---|---|---|---|---|"
              for d in coverage-reports/coverage-*/; do
                name=$(basename "$d"); lane=${name#coverage-}
                IFS='|' read -r lines funcs branches < <(lcov_totals "${d}coverage.lcov")
                if [ -f "${d}lanes.txt" ]; then
                  lane="**all gcov lanes merged** ($(paste -sd' ' "${d}lanes.txt"))"
                  funcs="-"; branches="-"
                else
                  lane="\`${lane}\`"
                fi
                printf '| %s | %s | %s | %s | [%s.tar.gz](%s/%s/releases/download/%s/blake3pp-%s.tar.gz) |\n' \
                  "$lane" "$lines" "$funcs" "$branches" "blake3pp-${name}" \
                  "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$tag" "$name"
              done
              for d in coverage-reports/coverage-*/; do
                [ -f "${d}summary.txt" ] || continue
                echo
                echo "<details><summary>$(basename "$d" | sed 's/^coverage-//'): per-file summary</summary>"
                echo
                echo '```'
                cat "${d}summary.txt"
                echo '```'
                echo '</details>'
              done
            fi
          } > release-notes.md
      - name: Create draft prerelease with assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ident.outputs.tag }}
          target_commitish: ${{ env.RELEASE_SHA }}
          name: dev build ${{ steps.ident.outputs.short }}${{ steps.ident.outputs.suffix }}
          prerelease: true
          draft: true
          files: |
            release/*.tar.gz
            release/*.zip
          body_path: release-notes.md

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.ident.outputs.tag }}" --draft=false --prerelease --repo "$GITHUB_REPOSITORY"

  # ----- manual fallback: no ci run to reuse, full rebuild in the zig
  # image, the one path that still needs a toolchain container. The
  # image is pulled by CONTENT tag (same scheme as ci.yml) so the build
  # matches its commit's docker/ tree.
  ident:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=tree-$(bash tools/toolchain-image-tag.sh)" >> "$GITHUB_OUTPUT"

  manual-release:
    needs: ident
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}/toolchain-zig:${{ needs.ident.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          cache-prefix: hfc-src2-linux-
      - name: Full release build
        run: sh tools/make-release.sh
      - name: Compute release identity
        id: ident
        run: |
          short=$(git rev-parse HEAD | cut -c1-12)
          echo "tag=dev-${short}" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
      # Same two-phase dance as the prerelease job: immutable releases
      # only accept assets while still a draft.
      - name: Create draft prerelease with assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ident.outputs.tag }}
          name: dev build ${{ steps.ident.outputs.short }} (manual rebuild)
          prerelease: true
          draft: true
          files: |
            release/*.tar.gz
            release/*.zip

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.ident.outputs.tag }}" --draft=false --prerelease --repo "$GITHUB_REPOSITORY"
