# Build & push the per-compiler toolchain images to GHCR.
#
# Two stages: the two per-release base instantiations first, then a
# per-image fan-out with one runner per toolchain image, each building FROM the exact base
# digest pushed in this run (the --set contexts.base override below), so all
# images of a distro cohort share identical base layers even across runners.
# Layer cache lives registry-side (GHA's 10 GB cache is too small for this
# set). First clang22 build is the long pole: the MSan libc++ stage compiles
# LLVM runtimes from source (~60-90 min on 2 cores), cached afterwards.
#
# REGISTRY and EXTRA_TAG are picked up by docker-bake.hcl as bake variables.
name: toolchain-images

# Normally invoked as a dependency job by ci.yml whenever a push/PR
# touches docker/**: ci's test jobs wait for these images and pull the
# immutable sha-<sha> tag this run pushed, so tests never race a :latest
# update or run against stale images. On pull_request invocations the
# :latest tag is NOT moved (only push/dispatch retag it): a PR must not
# repoint everyone's images before it merges. workflow_dispatch remains
# for a manual full refresh; there is deliberately no push trigger, as that
# would double-build against ci.yml's invocation.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository }}
  CACHE: ghcr.io/${{ github.repository }}/toolchain-cache
  # push/dispatch: publish sha tag AND move :latest. Called from a PR via
  # ci.yml: publish the sha tag only.
  TAG: ${{ github.event_name == 'pull_request' && format('sha-{0}', github.sha) || 'latest' }}
  EXTRA: ${{ github.event_name == 'pull_request' && '' || format('sha-{0}', github.sha) }}

jobs:
  bases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push base images
        run: |
          TAG="${TAG}" EXTRA_TAG="${EXTRA}" \
          docker buildx bake -f docker/docker-bake.hcl base --push \
            --set "base-*.cache-from=type=registry,ref=${CACHE}:base" \
            --set "base-*.cache-to=type=registry,ref=${CACHE}:base,mode=max"

  images:
    needs: bases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mirrors the {target, rel} table in docker/docker-bake.hcl; a
          # mismatch fails the build loudly.
          - { target: gcc14,       rel: "2404" }
          - { target: gcc16,       rel: "2604" }
          - { target: clang18,     rel: "2404" }
          - { target: clang20,     rel: "2404" }
          - { target: clang22,     rel: "2604" }
          - { target: arm64-gcc15, rel: "2604" }
          - { target: riscv64-gcc15, rel: "2604" }
          - { target: zig,         rel: "2604" }
          - { target: emscripten,  rel: "2604" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.target }}
        run: |
          BASE_TAG="sha-${GITHUB_SHA}"
          if [ -z "${EXTRA}" ]; then BASE_TAG="${TAG}"; fi
          TAG="${TAG}" EXTRA_TAG="${EXTRA}" \
          docker buildx bake -f docker/docker-bake.hcl "${{ matrix.target }}" --push \
            --set "*.contexts.base=docker-image://${REGISTRY}/toolchain-base-${{ matrix.rel }}:${BASE_TAG}" \
            --set "*.cache-from=type=registry,ref=${CACHE}:${{ matrix.target }}" \
            --set "*.cache-to=type=registry,ref=${CACHE}:${{ matrix.target }},mode=max"
