# Build & push the per-compiler toolchain images to GHCR.
#
# Images are CONTENT-ADDRESSED: the canonical tag is tree-<hash>, where
# the hash covers the docker/ git subtree, tools/build-msan-libcxx.sh and
# this workflow file. Identical content (across rebases, reverts, and
# merges) always maps to the same tag, so a build only ever happens when
# that tag does not exist yet (ci.yml checks existence and calls this workflow
# only on a miss). :latest is a convenience alias for local tools/tc use,
# moved only when move_latest is set (manual dispatch, or ci on a main
# push).
#
# Two stages: the two per-release base instantiations first, then a
# per-image fan-out with one runner per toolchain image, each building FROM
# the exact base tag pushed in this run, so all images of a distro cohort
# share identical base layers even across runners. Layer cache lives
# registry-side (GHA's 10 GB cache is too small for this set). First
# clang22 build is the long pole: the MSan libc++ stage compiles LLVM
# runtimes from source (~60-90 min on 2 cores), cached afterwards.
#
# The cluster behind `cmake-re --distributed` pulls the environment
# images itself, and GHCR is private, so every image also goes to a
# public mirror as a manifest copy (no rebuild): the repository variable
# BLAKE3PP_RBE_ENV_REGISTRY names it (a Docker Hub namespace, spelled
# without docker.io/: cmake-re matches the daemon's RepoDigests, which
# never carry that host), the
# secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN log in. Without them the
# mirror step is skipped.
name: toolchain-images

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "content tag to publish (computed when empty)"
        type: string
        default: ""
      move_latest:
        description: "also alias the images as :latest"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository }}
  CACHE: ghcr.io/${{ github.repository }}/toolchain-cache

jobs:
  ident:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      move_latest: ${{ steps.tag.outputs.move_latest }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_MOVE: ${{ inputs.move_latest }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          else
            tag="tree-$(bash tools/toolchain-image-tag.sh)"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # Manual dispatch is a deliberate refresh: always move latest.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "move_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "move_latest=${INPUT_MOVE}" >> "$GITHUB_OUTPUT"
          fi

  bases:
    needs: ident
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push base images
        run: |
          TAG="${{ needs.ident.outputs.tag }}" \
          EXTRA_TAG="${{ needs.ident.outputs.move_latest == 'true' && 'latest' || '' }}" \
          docker buildx bake -f docker/docker-bake.hcl base base-debian13 --push \
            --set "base-*.cache-from=type=registry,ref=${CACHE}:base" \
            --set "base-*.cache-to=type=registry,ref=${CACHE}:base,mode=max"

  images:
    needs: [ident, bases]
    runs-on: ubuntu-latest
    env:
      MIRROR: ${{ vars.BLAKE3PP_RBE_ENV_REGISTRY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mirrors the {target, rel} table in docker/docker-bake.hcl; a
          # mismatch fails the build loudly.
          - { target: gcc14,       rel: "2404" }
          - { target: gcc16,       rel: "2604" }
          - { target: clang18,     rel: "2404" }
          - { target: clang20,     rel: "2404" }
          - { target: clang22,     rel: "2604" }
          - { target: arm64-gcc15, rel: "2604" }
          - { target: riscv64-gcc15, rel: "2604" }
          - { target: ppc64le-gcc15, rel: "2604" }
          - { target: s390x-gcc15, rel: "2604" }
          # The one image on a Debian base: no Ubuntu release packages a
          # mips64el cross compiler (see base-debian13 in the bake file).
          - { target: mips64el-gcc14, rel: "debian13" }
          - { target: zig,         rel: "2604" }
          - { target: emscripten,  rel: "2604" }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.target }}
        run: |
          TAG="${{ needs.ident.outputs.tag }}" \
          EXTRA_TAG="${{ needs.ident.outputs.move_latest == 'true' && 'latest' || '' }}" \
          docker buildx bake -f docker/docker-bake.hcl "${{ matrix.target }}" --push \
            --set "*.contexts.base=docker-image://${REGISTRY}/toolchain-base-${{ matrix.rel }}:${{ needs.ident.outputs.tag }}" \
            --set "*.cache-from=type=registry,ref=${CACHE}:${{ matrix.target }}" \
            --set "*.cache-to=type=registry,ref=${CACHE}:${{ matrix.target }},mode=max"
      - uses: docker/login-action@v4
        if: env.MIRROR != '' && env.DOCKERHUB_USERNAME != ''
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Mirror ${{ matrix.target }} for the cluster
        if: env.MIRROR != '' && env.DOCKERHUB_USERNAME != ''
        run: |
          src="${REGISTRY}/toolchain-${{ matrix.target }}:${{ needs.ident.outputs.tag }}"
          dst="${MIRROR}/blake3pp-toolchain-${{ matrix.target }}"
          docker buildx imagetools create --tag "${dst}:${{ needs.ident.outputs.tag }}" "${src}"
          if [ "${{ needs.ident.outputs.move_latest }}" = "true" ]; then
            docker buildx imagetools create --tag "${dst}:latest" "${src}"
          fi
