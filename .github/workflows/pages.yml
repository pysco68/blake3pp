# The documentation site: every release plus main, under one dropdown.
#
# A Compiler Explorer link embeds the source it was made from; their
# compile nodes have no network, so no link can follow this repository.
# So the README points at a page here, and this workflow repoints that
# page at a freshly generated link whenever the library changes.
name: pages

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'include/**'
      - 'src/**'
      - 'docs/**'
      - 'examples/**'
      - 'README.md'
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes a waiting one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Every tag is built, so the whole history has to be here.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/requirements.txt

      # The same script a contributor runs locally, so the preview and the
      # published site cannot drift: website/build.sh --all --serve.
      - name: Build the site
        run: website/build.sh --all

      # The amalgamation is what the try links run, and it is generated
      # rather than kept in the repository, so this is where it gets built.
      # Linked and run, not syntax-checked: a header the generator forgot
      # to paste shows up at link time, and the demo prints the official
      # vector for "abc", so running it is the answer check.
      #
      # The runner's own g++ at the library's own baseline, C++20, which
      # is what the single file and its demo are written to. No skip: a
      # published try link that does not compile is a broken page, and a
      # step that cannot run proves nothing.
      - name: Compile and run the amalgamation
        run: |
          set -euo pipefail
          python3 website/amalgamate.py -o "${RUNNER_TEMP}/single-file.cpp"
          g++ --version
          g++ -std=c++20 -O2 -msse4.2 -Wall "${RUNNER_TEMP}/single-file.cpp" \
            -o "${RUNNER_TEMP}/single-file"
          out=$("${RUNNER_TEMP}/single-file")
          echo "${out}"
          echo "${out}" | grep -q \
            6437b3ac38465133ffb63b75273a8db548c558465d79db03fd359c6cd5bd9d85

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
