# Every containerizable preset runs INSIDE its per-compiler toolchain
# image (the same images tools/tc uses locally, built and pushed by
# toolchains.yml), split into matrices: `test` (pure validation:
# compiler cohort, sanitizers, arm64 emulation), `wasm` (ships), and `binaries`
# (the legs whose outputs ship or meet hardware), so the hardware lanes
# wait only on the bytes they run, never on a sanitizer suite. One
# entry point, tools/ci-test.sh, holds the per-architecture emulator
# matrices: qemu vector lengths and feature-off fallbacks for the cross
# presets, Intel SDE for AVX-512 on x86. Windows runs on the hosted windows-latest runners (x64 presets
# built AND tested; arm64 presets cross-built via vcvarsall x64_arm64,
# since x64 Windows cannot emulate arm64 and native arm64 testing is a gated
# extra job for the windows-11-arm runners). macOS runs the appleclang
# preset natively on the Apple-silicon macos-15 runners.
#
# Every platform that runs natively also runs the FULL bench, one rep
# (--reps 1 --cooldown 0), and uploads a bench-report-* artifact
# (silicon identity, dispatch verdict, all rows) which release.yml folds
# into the prerelease notes.
#
# Ordering with image changes, content-addressed: the toolchain images
# are keyed by tree-<hash> (the docker/ git subtree + the msan script +
# toolchains.yml; see tools/toolchain-image-tag.sh), and the `changes`
# job checks whether every image at that tag exists in GHCR. On a miss it
# calls toolchains.yml to build them FIRST; every test job then pulls
# exactly that content tag (never :latest), so tests can neither race a
# tag update nor run against images that do not match the checkout.
# Identical content never rebuilds: a rebase, revert or merge that lands
# the same docker/ tree hits the existing tag and skips straight to the
# tests. On main pushes the images are additionally aliased to :latest
# (built fresh, or promoted by manifest retag if they already existed)
# for local tools/tc users. Fork PRs cannot push packages: their image
# changes fall back to :latest with a visible warning.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "release/**"]
  pull_request:
    paths-ignore: ["**.md", "release/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  # Which content tag keys this checkout's toolchain images, and do they
  # already exist in GHCR? The image list is read from docker-bake.hcl
  # itself (bake --print), so there is no second list to drift.
  changes:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      build: ${{ steps.decide.outputs.build }}
      promote: ${{ steps.decide.outputs.promote }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: decide
        env:
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          # Ground truth for the hardware-lane gates: what this run
          # actually sees. Repository VARIABLES only (Variables tab, not
          # Secrets; not environment-scoped) reach the vars. context;
          # empty here means the gated job will skip, and why.
          echo "gate vars: CLOUDV_RISCV64='${{ vars.CLOUDV_RISCV64 }}' LINUX_ARM64_NATIVE='${{ vars.LINUX_ARM64_NATIVE }}' WIN_ARM64_NATIVE='${{ vars.WIN_ARM64_NATIVE }}'"
          tag="tree-$(bash tools/toolchain-image-tag.sh)"
          missing=0
          for ref in $(TAG="${tag}" docker buildx bake -f docker/docker-bake.hcl --print 2>/dev/null \
                       | jq -r '.target[].tags[]' | sort -u); do
            if ! docker manifest inspect "${ref}" > /dev/null 2>&1; then
              echo "missing: ${ref}"
              missing=1
            fi
          done
          if [ "${missing}" = 1 ] && [ "${IS_FORK_PR}" = "true" ]; then
            echo "::warning::image content changed in a fork PR; cannot push images, testing against :latest"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "promote=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "build=$([ "${missing}" = 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # :latest promotion for local tools/tc users: on main pushes
          # where the images already existed, alias them by manifest
          # retag (the build path moves :latest itself via move_latest).
          echo "promote=$([ "${missing}" = 0 ] && [ "${IS_MAIN_PUSH}" = "true" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Build + push the missing images before any test touches them.
  images:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/toolchains.yml
    with:
      tag: ${{ needs.changes.outputs.tag }}
      move_latest: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write

  # Cheap manifest-level :latest alias when the content tag already
  # existed (nothing to build) but main advanced to it.
  promote:
    needs: changes
    if: needs.changes.outputs.promote == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Alias content tags as latest
        env:
          TAG: ${{ needs.changes.outputs.tag }}
        run: |
          for ref in $(TAG="${TAG}" docker buildx bake -f docker/docker-bake.hcl --print 2>/dev/null \
                       | jq -r '.target[].tags[]' | sort -u); do
            docker buildx imagetools create -t "${ref%:*}:latest" "${ref}"
          done

  # Pure validation: the native compiler cohort, the sanitizers, and
  # the arm64 emulator matrix. Produces NOTHING downstream: no
  # artifacts, no hardware lane waits on it. It still gates the release
  # with everything else (release.yml fires only on a fully green run);
  # splitting it out just means the riscv boards do not idle behind an
  # msan suite (needs: can only reference whole jobs, never single
  # matrix legs, so unblocking the boards required two jobs).
  test:
    name: ${{ matrix.preset }}
    needs: [changes, images]
    # Run when images succeeded OR was skipped (no docker changes),
    # but never on a failed/cancelled image build.
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native compiler cohort, oldest floor to newest.
          - { preset: linux-gcc14-cxx23, image: gcc14 }
          - { preset: linux-gcc16-cxx26, image: gcc16 }
          - { preset: linux-clang18-cxx20-libstdcxx, image: clang18 }
          - { preset: linux-clang20-cxx23, image: clang20 }
          - { preset: linux-clang22-cxx26, image: clang22 }
          # Execution-provider alternative (beman.execution).
          - { preset: linux-clang22-cxx26-beman, image: clang22 }
          # Sanitizers: one address, one memory (against the baked
          # msan-libc++), one thread on the other compiler family.
          - { preset: linux-clang22-cxx26-asan, image: clang22 }
          - { preset: linux-clang22-cxx26-msan, image: clang22 }
          - { preset: linux-gcc16-cxx26-tsan, image: gcc16 }
          # POWER and IBM z crosses, emulator-in-the-loop: vsx (POWER9+)
          # and the project's first BIG-ENDIAN lane, vxe (z14); qemu CPU
          # matrices live in tools/ci-test.sh.
          - { preset: linux-ppc64le-gcc15-cxx23, image: ppc64le-gcc15 }
          - { preset: linux-s390x-gcc15-cxx23, image: s390x-gcc15 }
          # arm64 cross, emulator-in-the-loop (the SVE vector-length and
          # feature-off matrices live in tools/ci-test.sh; the aarch64
          # STATIC build is build-arm64-static below, feeding Neoverse).
          - { preset: linux-arm64-gcc15-cxx23, image: arm64-gcc15 }
    container:
      image: ghcr.io/${{ github.repository }}/toolchain-${{ matrix.image }}:${{ needs.changes.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Same as tools/tc and devcontainer.json runArgs: the sanitizer
      # runtimes need ptrace and an unfiltered seccomp profile.
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    env:
      CMAKE_GENERATOR: Ninja
      # Mirrors tools/tc's sanitizer environment.
      ASAN_SYMBOLIZER_PATH: /usr/local/bin/llvm-symbolizer
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1:strict_string_checks=1:symbolize=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:report_error_type=1
      TSAN_OPTIONS: second_deadlock_stack=1:halt_on_error=0
      LSAN_OPTIONS: use_tls=0
    steps:
      - uses: actions/checkout@v7

      # Container steps run as root while the version stamp shells out to
      # git in a runner-owned checkout; without this git refuses with
      # "dubious ownership" and the stamp falls back to the bare version.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The hermetic dependency cache (hfc): content-hash-keyed sources
      # under thirdparty/cache, shared across presets: one restore serves
      # every job, and a miss costs one population (stdexec is the big
      # clone). Keyed on the files that carry the dependency pins.
      - name: Cache hermetic dependencies
        uses: actions/cache@v6
        with:
          # POSITIVE globs only: just the path-free *-src trees (the
          # sources store nests another subbuild, hence the second line).
          # Everything else under thirdparty/cache embeds absolute
          # workspace paths in CMakeCache.txt files, so a cache written
          # under one mount poisons every job with another; it all
          # regenerates in seconds. Two hard-won rules encoded here:
          # !dir exclusion patterns do NOT reliably prune a directory's
          # contents (a mac cache shipped hfc/subbuild through them), so
          # never cache-by-subtraction; and per-OS key prefixes must be
          # DISJOINT, not extensions of each other (restore-keys
          # hfc-src- happily matched hfc-src-mac-*: macOS/Linux caches
          # cross-restore freely; only Windows ones are fenced by
          # enableCrossOsArchive). Generation src2: pre-fix entries can
          # never be restored.
          path: |
            thirdparty/cache/*-src
            thirdparty/cache/sources/*-src
          key: hfc-src2-linux-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'tests/CMakeLists.txt', 'bench/CMakeLists.txt', 'cli/CMakeLists.txt') }}
          restore-keys: hfc-src2-linux-

      - name: Configure, build, test (full emulator matrix)
        run: bash tools/ci-test.sh ${{ matrix.preset }}

  # WebAssembly, tested in node and SHIPPED (js+wasm pairs in the
  # release). Its own job rather than a `binaries` leg, so the Cloud-V
  # boards never wait on an unrelated wasm build.
  wasm:
    needs: [changes, images]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}/toolchain-emscripten:${{ needs.changes.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Cache hermetic dependencies
        uses: actions/cache@v6
        with:
          # Same positive-glob scheme as the test job above.
          path: |
            thirdparty/cache/*-src
            thirdparty/cache/sources/*-src
          key: hfc-src2-linux-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'tests/CMakeLists.txt', 'bench/CMakeLists.txt', 'cli/CMakeLists.txt') }}
          restore-keys: hfc-src2-linux-
      - name: Configure, build, test (node)
        run: bash tools/ci-test.sh wasm32-emcc-cxx23
      # The container shares the runner's CPU, so this benches v8's
      # SIMD128 JIT on real x86 silicon, the same logic that lets the
      # x86_64 static leg bench in place. Upstream BLAKE3 has no wasm
      # SIMD kernel, so the reference rows double as the story.
      - name: Bench report (wasm under node, runner x86_64 silicon)
        run: |
          { echo "== wasm32-simd128, node on the GitHub ubuntu-latest runner =="
            grep -m1 "model name" /proc/cpuinfo || true
            node --version
            node build/wasm32-emcc-cxx23/cli/blake3ppsum.js --version < /dev/null
            node build/wasm32-emcc-cxx23/bench/blake3pp_bench.js --reps 1 --cooldown 0
          } | tee bench-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-report-wasm32
          path: bench-report.txt
          retention-days: 7
      - name: Upload tool binaries
        uses: actions/upload-artifact@v7
        with:
          name: tool-binaries-wasm32
          retention-days: 3
          path: |
            build/wasm32-emcc-cxx23/cli/blake3ppsum.js
            build/wasm32-emcc-cxx23/cli/blake3ppsum.wasm
            build/wasm32-emcc-cxx23/cli/blake3ppgen.js
            build/wasm32-emcc-cxx23/cli/blake3ppgen.wasm
            build/wasm32-emcc-cxx23/bench/blake3pp_bench.js
            build/wasm32-emcc-cxx23/bench/blake3pp_bench.wasm
            build/wasm32-emcc-cxx23/bench/blake3pp_bench_file.js
            build/wasm32-emcc-cxx23/bench/blake3pp_bench_file.wasm

  # The legs whose OUTPUTS ship or meet hardware: the static musl release
  # chains (x86_64 + riscv64; the aarch64 twin is build-arm64-static
  # below) and the riscv64 gcc cross job, which runs the full RVV qemu
  # matrix and builds the freestanding xthead verifier the Pioneer
  # executes. This job, not the validation matrix above, is what the
  # Cloud-V boards wait on: scarce serialized board time starts as soon
  # as the bytes it will run are built and emulator-proven, without
  # idling behind sanitizer suites.
  binaries:
    name: ${{ matrix.preset }}
    needs: [changes, images]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-riscv64-gcc15-cxx23, image: riscv64-gcc15 }
          - { preset: linux-zigmusl-cxx23-static, image: zig }
          - { preset: linux-riscv64-zigmusl-cxx23-static, image: zig }
          # POWER and IBM z static musl: shipped release archives.
          # No hardware lane exists for them (yet): the bytes are
          # emulator-tested here and flagged as such in the notes.
          - { preset: linux-ppc64le-zigmusl-cxx23-static, image: zig }
          - { preset: linux-s390x-zigmusl-cxx23-static, image: zig }
    container:
      image: ghcr.io/${{ github.repository }}/toolchain-${{ matrix.image }}:${{ needs.changes.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Cache hermetic dependencies
        uses: actions/cache@v6
        with:
          # Same positive-glob scheme as the test job above; the full
          # reasoning lives there.
          path: |
            thirdparty/cache/*-src
            thirdparty/cache/sources/*-src
          key: hfc-src2-linux-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'tests/CMakeLists.txt', 'bench/CMakeLists.txt', 'cli/CMakeLists.txt') }}
          restore-keys: hfc-src2-linux-

      - name: Configure, build, test (full emulator matrix)
        run: bash tools/ci-test.sh ${{ matrix.preset }}

      # The container shares the runner's CPU, so the x86_64 static build
      # can bench right here, one of the hardware reports release.yml
      # appends to the prerelease notes.
      - name: Bench report (runner x86_64 silicon)
        if: matrix.preset == 'linux-zigmusl-cxx23-static'
        run: |
          { echo "== x86_64, GitHub ubuntu-latest runner, static musl build =="
            grep -m1 "model name" /proc/cpuinfo || true
            build/${{ matrix.preset }}/cli/blake3ppsum --version < /dev/null
            build/${{ matrix.preset }}/bench/blake3pp_bench --reps 1 --cooldown 0
          } | tee bench-report.txt
      - uses: actions/upload-artifact@v7
        if: matrix.preset == 'linux-zigmusl-cxx23-static'
        with:
          name: bench-report-x86_64
          path: bench-report.txt
          retention-days: 7
      # Static tool binaries for release.yml to package; the release
      # never rebuilds what ci already built and tested.
      - name: Upload static binaries
        if: contains(matrix.preset, 'zigmusl')
        uses: actions/upload-artifact@v7
        with:
          name: static-binaries-${{ contains(matrix.preset, 'riscv64') && 'riscv64' || contains(matrix.preset, 'ppc64le') && 'ppc64le' || contains(matrix.preset, 's390x') && 's390x' || 'x86_64' }}
          retention-days: 3
          # The tests binary rides along for the hardware jobs (Cloud-V
          # boards run it natively); release packaging ignores it.
          path: |
            build/${{ matrix.preset }}/tests/blake3pp_tests
            build/${{ matrix.preset }}/cli/blake3ppsum
            build/${{ matrix.preset }}/cli/blake3ppgen
            build/${{ matrix.preset }}/bench/blake3pp_bench
            build/${{ matrix.preset }}/bench/blake3pp_bench_file
      # The freestanding xthead verifier from the gcc cross job; the
      # Pioneer runs it on real 0.7.1 silicon (no libc, runs anywhere).
      - name: Upload xthead verifier
        if: matrix.preset == 'linux-riscv64-gcc15-cxx23'
        uses: actions/upload-artifact@v7
        with:
          name: xthead-verify
          retention-days: 3
          path: build/xthead-verify/xthead_verify

  # Windows, on the hosted runners; no toolchain image (those are Linux/
  # amd64); vswhere locates whatever VS the runner image ships and vcvars
  # provides cl/clang-cl/ninja. The x64 presets build and test natively;
  # the arm64 presets cross-build in the x64_arm64 environment
  # (compile-proven; x64 Windows cannot emulate arm64 binaries).
  windows:
    name: ${{ matrix.preset }}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: windows-msvc2026-cxx23, vcvars: x64, run_tests: true, upload: true }
          - { preset: windows-clangcl-cxx23, vcvars: x64, run_tests: true, upload: true }
          - { preset: windows-arm64-msvc2026-cxx23, vcvars: x64_arm64, run_tests: false, upload: true }
          - { preset: windows-arm64-clangcl-cxx23, vcvars: x64_arm64, run_tests: false, upload: true }
    steps:
      - uses: actions/checkout@v7
      - name: Cache hermetic dependencies
        uses: actions/cache@v6
        with:
          # Same positive-glob rule as the Linux jobs (see the test job);
          # disjoint win- prefix (Windows checkouts differ: CRLF etc.).
          path: |
            thirdparty/cache/*-src
            thirdparty/cache/sources/*-src
          key: hfc-src2-win-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'tests/CMakeLists.txt', 'bench/CMakeLists.txt', 'cli/CMakeLists.txt') }}
          restore-keys: hfc-src2-win-
      - name: Ensure ninja
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
      - name: Configure, build${{ matrix.run_tests && ', test' || ' (cross, compile-proven only)' }}
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find VC\Auxiliary\Build\vcvarsall.bat`) do set "VCVARSALL=%%i"
          if not defined VCVARSALL (echo vswhere found no vcvarsall & exit /b 1)
          call "%VCVARSALL%" ${{ matrix.vcvars }} || exit /b 1
          cmake --preset ${{ matrix.preset }} || exit /b 1
          cmake --build build\${{ matrix.preset }} -j %NUMBER_OF_PROCESSORS% || exit /b 1
          if "${{ matrix.run_tests }}"=="true" ctest --test-dir build\${{ matrix.preset }} --output-on-failure
      # Full bench, one rep, per compiler: the MSVC-vs-clang kernel gap is
      # a running storyline; this gives it a longitudinal record for free.
      # pwsh step discipline (every pwsh step in this file): the strict
      # preamble makes the FIRST failing native command abort the step
      # with its name and exit code; GitHub's default wrapper only
      # propagates the LAST command's exit code, silently swallowing
      # everything before it. Tee-Object streams live output into the
      # log AND the report file, since Out-File buffering reads as a
      # stuck step while the bench runs.
      - name: Bench report (runner x64 silicon)
        if: matrix.run_tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          "== x86_64 Windows, ${{ matrix.preset }}, GitHub windows-latest runner ==" | Tee-Object bench-report.txt
          (Get-CimInstance Win32_Processor).Name | Tee-Object bench-report.txt -Append
          & "build\${{ matrix.preset }}\cli\blake3ppsum.exe" --version 2>&1 | Tee-Object bench-report.txt -Append
          & "build\${{ matrix.preset }}\bench\blake3pp_bench.exe" --reps 1 --cooldown 0 2>&1 | Tee-Object bench-report.txt -Append
      - uses: actions/upload-artifact@v7
        if: matrix.run_tests
        with:
          name: bench-report-${{ matrix.preset }}
          path: bench-report.txt
          retention-days: 7
      # PE-machine audit for the cross legs: cl.exe takes its TARGET
      # from the vcvars shell (clang-cl is pinned via -target), so a
      # shell-arch mixup would build x64 bytes that windows-11-arm runs
      # under TRANSPARENT x64 emulation: tests pass, just 5-10x slower.
      # Assert the architecture instead of trusting the shell.
      - name: PE machine audit (arm64 preset must emit ARM64)
        if: ${{ !matrix.run_tests }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          foreach ($d in 'cli', 'bench', 'tests') {
            Get-ChildItem "build\${{ matrix.preset }}\$d" -Filter *.exe | ForEach-Object {
              $b = [IO.File]::ReadAllBytes($_.FullName)
              $m = [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3C) + 4)
              Write-Host ("{0}: machine 0x{1:X4}" -f $_.Name, $m)
              if ($m -ne 0xAA64) { $bad += $_.Name }
            }
          }
          if ($bad) { throw "non-ARM64 PE in an arm64 preset: $bad" }
      - name: Kernel audit (each variant's object carries its ISA and nothing above it)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python tools\objscan.py audit build\${{ matrix.preset }}
      # Tool binaries for release.yml: both compilers on both
      # architectures (the msvc-vs-clangcl kernel gap makes shipping
      # both worthwhile). The arm64 zips are cross-built, natively
      # tested only when the windows-11-arm lane is enabled, and the
      # release notes flag exactly that.
      - name: Upload tool binaries
        if: matrix.upload
        uses: actions/upload-artifact@v7
        with:
          name: tool-binaries-${{ matrix.preset }}
          retention-days: 3
          # The tests binary rides along so the native-arm64 job can run
          # the oracle suite against exactly these bytes; the release
          # packaging copies only cli/bench and ignores it.
          path: |
            build/${{ matrix.preset }}/cli/blake3ppsum.exe
            build/${{ matrix.preset }}/cli/blake3ppgen.exe
            build/${{ matrix.preset }}/bench/blake3pp_bench.exe
            build/${{ matrix.preset }}/bench/blake3pp_bench_file.exe
            build/${{ matrix.preset }}/tests/blake3pp_tests.exe

  # macOS on the Apple-silicon macos-15 runners: Apple clang exercises
  # the GCD + F_NOCACHE I/O backend in CI and ships the macos release
  # artifact. The macos-clang22-cxx26 preset is deliberately NOT a lane:
  # the runner image preinstalls only Homebrew llvm@18, LLVM 22 would
  # cost a multi-minute bottle pour on the scarcest runner pool, and its
  # incremental coverage is thin: linux-clang22-cxx26 already tests the
  # same clang major/libc++/providers, and appleclang covers Darwin. The
  # preset stays for local use on a brewed Mac (brew install llvm@22);
  # re-adding the lane is one matrix line + an install step.
  macos:
    name: ${{ matrix.preset }}
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        preset: [macos-appleclang-cxx23]
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7
      - name: Cache hermetic dependencies
        uses: actions/cache@v6
        with:
          # Same positive-glob rule as the Linux jobs (see the test job);
          # disjoint mac- prefix.
          path: |
            thirdparty/cache/*-src
            thirdparty/cache/sources/*-src
          key: hfc-src2-mac-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'tests/CMakeLists.txt', 'bench/CMakeLists.txt', 'cli/CMakeLists.txt') }}
          restore-keys: hfc-src2-mac-
      - name: Ensure ninja
        run: which ninja || brew install ninja
      - name: Configure, build, test
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build build/${{ matrix.preset }} -j"$(sysctl -n hw.ncpu)"
          ctest --test-dir build/${{ matrix.preset }} --output-on-failure
      - name: Kernel audit (each variant's object carries its ISA and nothing above it)
        run: python3 tools/objscan.py audit build/${{ matrix.preset }} --binary build/${{ matrix.preset }}/cli/blake3ppsum
      - name: Bench report (Apple silicon)
        run: |
          { echo "== aarch64, GitHub macos-15 runner ($(sysctl -n machdep.cpu.brand_string)), ${{ matrix.preset }} =="
            echo "cores: $(sysctl -n hw.ncpu)"
            build/${{ matrix.preset }}/cli/blake3ppsum --version < /dev/null
            build/${{ matrix.preset }}/bench/blake3pp_bench --reps 1 --cooldown 0
          } | tee bench-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-report-${{ matrix.preset }}
          path: bench-report.txt
          retention-days: 7
      # Tool binaries for release.yml, from the appleclang build only: the
      # Homebrew-LLVM build rpaths its bundled libc++ under /opt/homebrew
      # and is not portable off a brewed machine.
      - name: Upload tool binaries
        if: matrix.preset == 'macos-appleclang-cxx23'
        run: strip build/${{ matrix.preset }}/cli/blake3ppsum build/${{ matrix.preset }}/cli/blake3ppgen build/${{ matrix.preset }}/bench/blake3pp_bench build/${{ matrix.preset }}/bench/blake3pp_bench_file
      - uses: actions/upload-artifact@v7
        if: matrix.preset == 'macos-appleclang-cxx23'
        with:
          name: tool-binaries-macos-arm64
          retention-days: 3
          path: |
            build/${{ matrix.preset }}/cli/blake3ppsum
            build/${{ matrix.preset }}/cli/blake3ppgen
            build/${{ matrix.preset }}/bench/blake3pp_bench
            build/${{ matrix.preset }}/bench/blake3pp_bench_file

  # Native arm64 Windows testing on GitHub's windows-11-arm runners
  # (actions/runner-images Windows11-Arm64 image): runs the CROSS-BUILT
  # binaries (the Neoverse pattern) so the arm64 archives the release
  # ships are exactly the bytes tested here. OPT-IN via repository
  # variable WIN_ARM64_NATIVE=1: the label DOES serve this private repo
  # (observed 2026-08-30: a run completed on Cobalt 100 silicon), but
  # private-repo hosted minutes are BILLED, Windows ones at a premium,
  # so hardware lanes stay a deliberate opt-in rather than a default
  # spend. Bench note from that first run: on Windows this Neoverse N2
  # runs the NEON kernel: the clang-cl build registers no SVE variants
  # by construction, and Windows on Arm exposes no user-mode SVE anyway.
  windows-arm64-native:
    name: windows-arm64 native test (${{ matrix.preset }})
    needs: windows
    # Status-function form for the same reason as the other hardware
    # lanes (see neoverse-test-bench): immune to transitive
    # skip-poisoning should this chain ever gain a skippable ancestor.
    if: ${{ !cancelled() && needs.windows.result == 'success' && vars.WIN_ARM64_NATIVE == '1' }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-arm64-msvc2026-cxx23, windows-arm64-clangcl-cxx23]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tool-binaries-${{ matrix.preset }}
      # One logical action per step from here on: when something fails,
      # the step NAME is the diagnosis (a chained block reports only
      # "exit code 1" with no culprit). The strict preamble in each pwsh
      # step aborts on the first failing native command and names it.
      - name: Show artifact layout
        shell: pwsh
        run: Get-ChildItem -Recurse -Name | Sort-Object
      # x64 bytes would RUN here (transparently emulated, 5-10x slow),
      # so prove these are arm64 before timing anything.
      - name: PE machine audit (downloaded binaries are ARM64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          Get-ChildItem -Recurse -Filter *.exe | ForEach-Object {
            $b = [IO.File]::ReadAllBytes($_.FullName)
            $m = [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3C) + 4)
            Write-Host ("{0}: machine 0x{1:X4}" -f $_.Name, $m)
            if ($m -ne 0xAA64) { $bad += $_.Name }
          }
          if ($bad) { throw "non-ARM64 PE downloaded onto the arm64 runner: $bad" }
      - name: CPU identity
        shell: pwsh
        run: (Get-CimInstance Win32_Processor).Name
      # Triage smoke: probe EVERY binary, not just the first (which
      # binaries crash discriminates hypotheses: the tests binary is the
      # only one not linking the tool allocator), then pull the Windows
      # Error Reporting events for any crash: faulting module + offset,
      # mappable to an instruction in a dumpbin disassembly.
      - name: Startup smoke (all binaries, crash triage)
        shell: pwsh
        run: |
          $failed = @()
          foreach ($probe in @(
              @{exe = 'cli\blake3ppsum.exe';       args = @('--version')},
              @{exe = 'cli\blake3ppgen.exe';       args = @('--help')},
              @{exe = 'bench\blake3pp_bench.exe';  args = @('--help')},
              @{exe = 'tests\blake3pp_tests.exe';  args = @('--version')})) {
            & $probe.exe @($probe.args) 2>&1 | ForEach-Object { "  $_" }
            $code = $LASTEXITCODE
            "{0} -> exit 0x{1:X8} ({1})" -f $probe.exe, $code
            if ($code -ne 0) { $failed += $probe.exe }
          }
          if ($failed) {
            Start-Sleep -Seconds 5  # let WER finish writing the event
            "== WER crash events =="
            Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000} -MaxEvents 5 -ErrorAction SilentlyContinue |
              ForEach-Object { $_.TimeCreated; $_.Message; '---' }
            throw "startup crash in: $failed"
          }
      - name: Test the cross-built binaries on real arm64 Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & "tests\blake3pp_tests.exe"
      # Tee-Object streams the bench live into the log while building
      # the report file; Out-File buffering read as a stuck step.
      - name: Bench report (arm64 Windows silicon)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          "== arm64 Windows, GitHub windows-11-arm runner, ${{ matrix.preset }} (cross-built) ==" | Tee-Object bench-report.txt
          (Get-CimInstance Win32_Processor).Name | Tee-Object bench-report.txt -Append
          & "cli\blake3ppsum.exe" --version 2>&1 | Tee-Object bench-report.txt -Append
          & "bench\blake3pp_bench.exe" --reps 1 --cooldown 0 2>&1 | Tee-Object bench-report.txt -Append
      - uses: actions/upload-artifact@v7
        with:
          name: bench-report-${{ matrix.preset }}-native
          path: bench-report.txt
          retention-days: 7

  # The aarch64 static musl chain, built cross in the zig image, binaries
  # handed to the Neoverse job below and to release.yml.
  build-arm64-static:
    needs: [changes, images]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/${{ github.repository }}/toolchain-zig:${{ needs.changes.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Cache hermetic dependencies
        uses: actions/cache@v6
        with:
          # POSITIVE globs only: just the path-free *-src trees (the
          # sources store nests another subbuild, hence the second line).
          # Everything else under thirdparty/cache embeds absolute
          # workspace paths in CMakeCache.txt files, so a cache written
          # under one mount poisons every job with another; it all
          # regenerates in seconds. Two hard-won rules encoded here:
          # !dir exclusion patterns do NOT reliably prune a directory's
          # contents (a mac cache shipped hfc/subbuild through them), so
          # never cache-by-subtraction; and per-OS key prefixes must be
          # DISJOINT, not extensions of each other (restore-keys
          # hfc-src- happily matched hfc-src-mac-*: macOS/Linux caches
          # cross-restore freely; only Windows ones are fenced by
          # enableCrossOsArchive). Generation src2: pre-fix entries can
          # never be restored.
          path: |
            thirdparty/cache/*-src
            thirdparty/cache/sources/*-src
          key: hfc-src2-linux-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'tests/CMakeLists.txt', 'bench/CMakeLists.txt', 'cli/CMakeLists.txt') }}
          restore-keys: hfc-src2-linux-
      # One default-config qemu ctest only: the SVE VL matrix already runs
      # on the linux-arm64-gcc15 preset, and the Neoverse job covers VL=128
      # on real silicon; repeating the emulation matrix here would only
      # delay the runner waiting on this job's binaries.
      - name: Build and test (default qemu config)
        run: |
          cmake --preset linux-arm64-zigmusl-cxx23-static
          cmake --build build/linux-arm64-zigmusl-cxx23-static -j"$(nproc)"
          ctest --test-dir build/linux-arm64-zigmusl-cxx23-static --output-on-failure
      - uses: actions/upload-artifact@v7
        with:
          name: static-binaries-aarch64
          retention-days: 3
          path: |
            build/linux-arm64-zigmusl-cxx23-static/tests/blake3pp_tests
            build/linux-arm64-zigmusl-cxx23-static/cli/blake3ppsum
            build/linux-arm64-zigmusl-cxx23-static/cli/blake3ppgen
            build/linux-arm64-zigmusl-cxx23-static/bench/blake3pp_bench
            build/linux-arm64-zigmusl-cxx23-static/bench/blake3pp_bench_file

  # Real ARM silicon, no emulator and no native toolchain: GitHub's free
  # arm64 runners are Azure Cobalt 100: Neoverse N2, Armv9 SVE2 at
  # VL=128, exactly the sve2_128 kernel's target hardware. Runs the
  # cross-built static binaries: the full test suite (real-CPU dispatch
  # coverage, and the standing answer to "does the runner expose SVE?";
  # read the variants line), then a short indicative bench. Shared-runner
  # numbers are NOT measurements (thermal/noisy-neighbor caveats apply),
  # but a sve2_128-vs-neon ratio collapsing to 1.0 would still be a
  # regression signal.
  # OPT-IN via repository variable LINUX_ARM64_NATIVE=1: the arm64
  # labels serve this private repo (the windows-11-arm twin proved it on
  # real Cobalt silicon), but private-repo hosted minutes are billed;
  # hardware lanes are a deliberate opt-in spend, not a default.
  neoverse-test-bench:
    name: neoverse-n2 test+bench (real SVE2 silicon)
    needs: build-arm64-static
    # The !cancelled() + explicit result check is LOAD-BEARING, not
    # style: without a status function in the if, GitHub prepends an
    # implicit success() that fails when ANY TRANSITIVE ancestor was
    # skipped, and `images` is skipped on almost every run. The
    # !cancelled() override upstream protects only the job carrying it;
    # every descendant must break the cascade again. (This kept the
    # hardware lanes skipping for a day while vars, labels and direct
    # needs were all demonstrably correct.)
    if: ${{ !cancelled() && needs.build-arm64-static.result == 'success' && vars.LINUX_ARM64_NATIVE == '1' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: static-binaries-aarch64
      - name: What silicon is this really
        run: |
          chmod +x tests/blake3pp_tests cli/blake3ppsum cli/blake3ppgen bench/blake3pp_bench
          lscpu | grep -iE 'model name|flags' | cut -c1-200 || true
          cli/blake3ppsum --version
      - name: Test on real silicon
        run: tests/blake3pp_tests
      - name: Bench report (real SVE2 silicon)
        run: |
          { echo "== aarch64, GitHub ubuntu-24.04-arm (Azure Cobalt 100 / Neoverse N2), static musl build =="
            lscpu | grep -iE "model name|flags" | cut -c1-200 || true
            cli/blake3ppsum --version < /dev/null
            bench/blake3pp_bench --reps 1 --cooldown 0
          } | tee bench-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-report-neoverse-n2
          path: bench-report.txt
          retention-days: 7

  # RISC-V hardware validation across the Cloud-V board fleet
  # (https://cloud-v.co, runner docs: 10x-engineers.github.io/
  # riscv-ci-partners): one board per vector story, so the dispatch
  # matrix meets real silicon at every tier:
  #   visionfive2   JH7110      RV64GC, NO vector: the scalar fallback
  #   bpi-f3        SpacemiT K1 RVV 1.0 (VLEN=256): real rvv256
  #   milkv-pioneer SG2042      XTheadVector (draft 0.7.1), 64 cores
  # The boards BUILD NOTHING (the Neoverse pattern): they download the
  # ci-built static musl binaries (which run on any riscv64 Linux,
  # regardless of libc) plus, on the Pioneer, the freestanding
  # xthead_verify (no libc at all), so the hand-written 0.7.1 kernel is
  # exercised on the silicon it was written for. needs: binaries rather
  # than the wider validation matrix, so scarce, serialized board time
  # starts the moment its own bytes are built and emulator-proven,
  # without idling behind the sanitizer suites; those still gate the
  # RELEASE, just not the boards. (The musl bench carries no xthead
  # variant because clang cannot build it, so Pioneer bench rows are
  # scalar + the 64-core parallel engine; xthead BENCH numbers would
  # need a native gcc build, deliberately out of scope here.)
  # Gated on CLOUDV_RISCV64=1 (self-hosted labels queue forever when
  # unregistered, unlike hosted ones).
  riscv-boards:
    name: riscv64 ${{ matrix.board }} (Cloud-V)
    needs: binaries
    # Same load-bearing pattern as neoverse-test-bench above: the
    # status function breaks the transitive skip-poisoning from the
    # (almost always skipped) images job; the implicit success() would
    # veto this job regardless of the var and the green direct need.
    if: ${{ !cancelled() && needs.binaries.result == 'success' && vars.CLOUDV_RISCV64 == '1' }}
    runs-on: [self-hosted, "${{ matrix.board }}"]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { board: visionfive2, xthead: false }
          - { board: bpi-f3, xthead: false }
          - { board: milkv-pioneer, xthead: true }
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: static-binaries-riscv64
      - uses: actions/download-artifact@v8
        if: matrix.xthead
        with:
          name: xthead-verify
      - name: What silicon is this really
        run: |
          chmod +x tests/blake3pp_tests cli/blake3ppsum cli/blake3ppgen bench/blake3pp_bench bench/blake3pp_bench_file
          uname -a
          { lscpu | head -20; } 2>/dev/null || sort -u /proc/cpuinfo | head -20
          cli/blake3ppsum --version
      - name: Test the ci-built binaries on real silicon
        run: tests/blake3pp_tests
      - name: xthead oracle on real 0.7.1 silicon (freestanding verifier)
        if: matrix.xthead
        run: chmod +x xthead_verify && ./xthead_verify
      - name: Bench report (real RISC-V silicon)
        run: |
          { echo "== riscv64, Cloud-V ${{ matrix.board }}, ci-built static musl binaries =="
            { lscpu | head -20; } 2>/dev/null || sort -u /proc/cpuinfo | head -20
            cli/blake3ppsum --version < /dev/null
            bench/blake3pp_bench --reps 1 --cooldown 0
          } | tee bench-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-report-riscv64-${{ matrix.board }}
          path: bench-report.txt
          retention-days: 7
