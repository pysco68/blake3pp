# Every containerizable preset runs INSIDE its per-compiler toolchain
# image (the same images tools/tc uses locally, built and pushed by
# toolchains.yml), split into matrices: `test` (pure validation:
# compiler cohort, sanitizers, arm64 emulation), `wasm` (ships), and `binaries`
# (the legs whose outputs ship or meet hardware), so the hardware lanes
# wait only on the bytes they run, never on a sanitizer suite. One
# entry point, tools/ci-test.sh, holds the per-architecture emulator
# matrices: qemu vector lengths and feature-off fallbacks for the cross
# presets, Intel SDE for AVX-512 on x86 runners whose silicon lacks it,
# and the coverage report for the coverage presets (uploaded as
# coverage-<preset>, folded into the release notes by release.yml).
# Windows runs on the hosted windows-latest runners (x64 presets
# built AND tested; arm64 presets cross-built via vcvarsall x64_arm64,
# since x64 Windows cannot emulate arm64 and native arm64 testing is a gated
# extra job for the windows-11-arm runners). macOS runs the appleclang
# preset natively on the Apple-silicon macos-15 runners.
#
# FreeBSD is the one target OS that cannot be emulated at the process
# level: no qemu-user persona serves a FreeBSD userland, so both FreeBSD
# lanes cross-compile with zig in the toolchain-zig image and then boot
# a whole FreeBSD under qemu on the runner to execute the result.
# `freebsd-build` + `freebsd-test` do that for amd64 under KVM;
# `freebsd-arm64-build` + `freebsd-arm64-test` do it for arm64 under
# TCG, because no GitHub runner can KVM an aarch64 guest -- KVM
# virtualises, it does not translate, and there is no arm64 runner with
# /dev/kvm to translate on. TCG costs that lane about two minutes to
# boot and a hundred seconds for the suite, which is why it is an
# every-push lane like the ppc64le and s390x emulator lanes rather than
# a gated one. Both guest images are published by toolchains.yml like
# any other image, so the lanes pull versioned guests rather than
# building them. Both ship: release.yml packages
# blake3pp-<version>-freebsd-{amd64,arm64} from these binaries, the only
# archives in the set that are dynamically linked.
#
# Every platform that runs natively also runs the FULL bench, one rep
# (--reps 1 --cooldown 0), and uploads a bench-report-* artifact
# (silicon identity, dispatch verdict, all rows) which release.yml folds
# into the prerelease notes.
#
# Ordering with image changes, content-addressed: the toolchain images
# are keyed by tree-<hash> (the docker/ git subtree + the msan script +
# toolchains.yml; see tools/toolchain-image-tag.sh), and the `changes`
# job checks whether every image at that tag exists in GHCR. On a miss it
# calls toolchains.yml to build them FIRST; every test job then pulls
# exactly that content tag (never :latest), so tests can neither race a
# tag update nor run against images that do not match the checkout.
# Identical content never rebuilds: a rebase, revert or merge that lands
# the same docker/ tree hits the existing tag and skips straight to the
# tests. On main pushes the images are additionally aliased to :latest
# (built fresh, or promoted by manifest retag if they already existed)
# for local tools/tc users.
#
# Pull requests from forks do not run this workflow at all: every root
# job (changes, windows, macos; everything else hangs off them) is gated
# on the head repository being this one. The minutes are billed here,
# the lanes read repository secrets, and the hardware lanes are shared
# boards. The repository setting "Fork pull request workflows: require
# approval for all outside collaborators" is the second lock.
#
# Build driver, one switch for every Linux container lane: the
# repository variable BLAKE3PP_CI_DRIVER (Variables tab) set to
# `cmake-re` runs configure and build through cmake-re with the compile
# actions on the EngFlow cluster when the variable BLAKE3PP_CMAKE_RE_MODE
# (or the cmake-re-mode dispatch input) is `distributed` (secrets
# RBE_SERVICE, RBE_TLS_CLIENT_AUTH_KEY, RBE_TLS_CLIENT_AUTH_CERT;
# optionally the variable BLAKE3PP_RBE_ENV_REGISTRY, the registry the
# cluster pulls
# environment images from until GHCR is public), anything else runs
# plain cmake. The `driver` dispatch input overrides the variable for
# one run. Both drivers go through tools/ci-test.sh, so tests, emulator
# matrices and coverage are the same; only where the compiler runs
# differs. Windows and macOS are always native.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "release/**"]
  pull_request:
    # ready_for_review: the environment-files PR below is opened as a
    # draft (a PR opened with GITHUB_TOKEN gets no workflow run of its
    # own); marking it ready is the user-made event that runs CI on it.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "release/**"]
  workflow_dispatch:
    inputs:
      driver:
        description: "build driver for the Linux lanes (auto: the BLAKE3PP_CI_DRIVER repository variable, else cmake)"
        type: choice
        options: ["auto", "cmake", "cmake-re"]
        default: "auto"
      cmake-re-mode:
        description: "where cmake-re builds (auto: the BLAKE3PP_CMAKE_RE_MODE repository variable, else host)"
        type: choice
        options: ["auto", "host", "distributed"]
        default: "auto"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  # Which content tag keys this checkout's toolchain images, and do they
  # already exist in GHCR? The image list is read from docker-bake.hcl
  # itself (bake --print), so there is no second list to drift.
  changes:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      build: ${{ steps.decide.outputs.build }}
      promote: ${{ steps.decide.outputs.promote }}
      driver: ${{ steps.decide.outputs.driver }}
      cmake-re-mode: ${{ steps.decide.outputs.cmake_re_mode }}
      windows-matrix: ${{ steps.decide.outputs.windows_matrix }}
      windows-arm64-matrix: ${{ steps.decide.outputs.windows_arm64_matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: decide
        env:
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          # Ground truth for the hardware-lane gates: what this run
          # actually sees. Repository VARIABLES only (Variables tab, not
          # Secrets; not environment-scoped) reach the vars. context;
          # empty here means the gated job will skip, and why.
          echo "gate vars: CLOUDV_RISCV64='${{ vars.CLOUDV_RISCV64 }}' LINUX_ARM64_NATIVE='${{ vars.LINUX_ARM64_NATIVE }}' WIN_ARM64_NATIVE='${{ vars.WIN_ARM64_NATIVE }}' WINDOWS_MSVC='${{ vars.WINDOWS_MSVC }}'"
          # The Windows legs, as a matrix rather than a job gate: cl
          # compiles the vector kernel TU 15 to 20 times slower than
          # clang-cl does (36 s for the scalar variant against 500-700 s
          # for each vector one, measured on the same machine), which
          # makes windows-msvc2026-cxx23 the longest job in the run at
          # 16 minutes. Nothing ships from them either: the release
          # packages clang-cl only, since what cl produces hashes at
          # roughly half the rate. WINDOWS_MSVC=1 puts both presets
          # back, as the conformance check they are.
          clangcl='{"preset":"windows-clangcl-cxx23","vcvars":"x64","run_tests":true,"upload":true}'
          clangcl_arm='{"preset":"windows-arm64-clangcl-cxx23","vcvars":"x64_arm64","run_tests":false,"upload":true}'
          msvc='{"preset":"windows-msvc2026-cxx23","vcvars":"x64","run_tests":true,"upload":true}'
          msvc_arm='{"preset":"windows-arm64-msvc2026-cxx23","vcvars":"x64_arm64","run_tests":false,"upload":true}'
          if [ "${{ vars.WINDOWS_MSVC }}" = 1 ]; then
            windows="[${msvc},${clangcl},${msvc_arm},${clangcl_arm}]"
            windows_arm64='["windows-arm64-msvc2026-cxx23","windows-arm64-clangcl-cxx23"]'
            echo "windows: MSVC lanes ON"
          else
            windows="[${clangcl},${clangcl_arm}]"
            windows_arm64='["windows-arm64-clangcl-cxx23"]'
            echo "windows: MSVC lanes off (set WINDOWS_MSVC=1 to run them)"
          fi
          echo "windows_matrix=${windows}" >> "$GITHUB_OUTPUT"
          echo "windows_arm64_matrix=${windows_arm64}" >> "$GITHUB_OUTPUT"
          driver="${{ inputs.driver != 'auto' && inputs.driver || vars.BLAKE3PP_CI_DRIVER }}"
          [ "${driver}" = cmake-re ] || driver=cmake
          echo "build driver: ${driver}"
          echo "driver=${driver}" >> "$GITHUB_OUTPUT"
          # Where cmake-re builds: --host alone (the image's own
          # compilers, no cluster and no secrets needed) unless the mode
          # says distributed.
          mode="${{ inputs.cmake-re-mode != 'auto' && inputs.cmake-re-mode || vars.BLAKE3PP_CMAKE_RE_MODE }}"
          [ "${mode}" = distributed ] || mode=host
          echo "cmake-re mode: ${mode}"
          echo "cmake_re_mode=${mode}" >> "$GITHUB_OUTPUT"
          tag="tree-$(bash tools/toolchain-image-tag.sh)"
          missing=0
          for ref in $(TAG="${tag}" docker buildx bake -f docker/docker-bake.hcl --print 2>/dev/null \
                       | jq -r '.target[].tags[]' | sort -u); do
            if ! docker manifest inspect "${ref}" > /dev/null 2>&1; then
              echo "missing: ${ref}"
              missing=1
            fi
          done
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "build=$([ "${missing}" = 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # :latest promotion for local tools/tc users: on main pushes
          # where the images already existed, alias them by manifest
          # retag (the build path moves :latest itself via move_latest).
          echo "promote=$([ "${missing}" = 0 ] && [ "${IS_MAIN_PUSH}" = "true" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
  # Build + push the missing images before any test touches them.
  images:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/toolchains.yml
    with:
      tag: ${{ needs.changes.outputs.tag }}
      move_latest: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # The Docker Hub credentials of the mirror step (a called workflow
    # sees no secrets unless the caller hands them over).
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # Cheap manifest-level :latest alias when the content tag already
  # existed (nothing to build) but main advanced to it.
  promote:
    needs: changes
    if: needs.changes.outputs.promote == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Alias content tags as latest
        env:
          TAG: ${{ needs.changes.outputs.tag }}
        run: |
          for ref in $(TAG="${TAG}" docker buildx bake -f docker/docker-bake.hcl --print 2>/dev/null \
                       | jq -r '.target[].tags[]' | sort -u); do
            docker buildx imagetools create -t "${ref%:*}:latest" "${ref}"
          done

  # The cmake-re environment files (cmake/toolchains/<name>/*.pkr.js)
  # pin the image at a content tag and at the manifest digest that tag
  # resolves to, so they are written once the images exist: here, once
  # per run, and every lane takes the digests from the artifact. The
  # pipeline builds on the files at this run's tag, dirty checkout or
  # not; when the committed files lag, one PR proposes the update, on
  # main pushes only, updated in place while the tag keeps moving. The
  # release notes of a run that built on injected files say so.
  environments:
    needs: [changes, images]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-latest
    # contents/pull-requests: write for the PR.
    permissions:
      contents: write
      pull-requests: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: environments
        env:
          TAG: ${{ needs.changes.outputs.tag }}
        run: |
          canon=$(grep -ho 'tree-[0-9a-f]*' cmake/toolchains/linux-gcc16-cxx26/linux-gcc16-cxx26.pkr.js | head -1)
          python3 tools/gen-environments.py --tag "${TAG}" --write-digests "$RUNNER_TEMP/toolchain-digests.json"
          if git diff --quiet -- cmake/toolchains; then stale=false; else stale=true; fi
          echo "environment files: image tag ${TAG}, committed ${canon}, stale=${stale}"
          echo "stale=${stale}" >> "$GITHUB_OUTPUT"
          printf 'stale=%s\ntag=%s\ncanon=%s\n' "${stale}" "${TAG}" "${canon}" > "$RUNNER_TEMP/toolchain-environments.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: toolchain-environments
          path: |
            ${{ runner.temp }}/toolchain-environments.txt
            ${{ runner.temp }}/toolchain-digests.json
      # Opened as a draft: GitHub starts no workflow for events made
      # with GITHUB_TOKEN, so the PR gets its CI run when someone marks
      # it ready for review (ready_for_review in the trigger above).
      - name: Propose the committed environment files
        if: steps.environments.outputs.stale == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ci/toolchain-environments
          draft: true
          delete-branch: true
          add-paths: cmake/toolchains
          commit-message: "toolchains: environment files at image tag ${{ needs.changes.outputs.tag }}"
          title: "toolchains: environment files at image tag ${{ needs.changes.outputs.tag }}"
          body: |
            The toolchain images of `main` are at content tag `${{ needs.changes.outputs.tag }}`; the committed cmake-re environment files still name an older tag or digest. The ci runs of `main` build on the injected files meanwhile (their releases are marked as built on uncommitted environment files); merging this makes the checkout clean again. Updated in place by ci while the tag moves; mark it ready for review to run CI on it.

  # The single-file amalgamation, compiled and run on every pull request.
  # The pages workflow builds it too, but that one fires only on main and
  # on tags, so without this a change that breaks the generated file is
  # found after it is published. Nothing else needs this job: it is a
  # check, not an input.
  amalgamation:
    name: amalgamation
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Linked and run, not syntax-checked: a header the generator forgot
      # to paste shows up at link time, and the demo prints the official
      # vector for "abc", which is the answer check. C++20 is the
      # library's baseline and what the generated file is written to, so
      # the runner's own g++ builds it.
      - name: Compile and run the amalgamation
        run: |
          set -euo pipefail
          python3 website/amalgamate.py -o "${RUNNER_TEMP}/single-file.cpp"
          g++ --version
          g++ -std=c++20 -O2 -msse4.2 -Wall "${RUNNER_TEMP}/single-file.cpp" \
            -o "${RUNNER_TEMP}/single-file"
          out=$("${RUNNER_TEMP}/single-file")
          echo "${out}"
          echo "${out}" | grep -q \
            6437b3ac38465133ffb63b75273a8db548c558465d79db03fd359c6cd5bd9d85

  # Pure validation: the native compiler cohort, the sanitizers, and
  # the arm64 emulator matrix. Produces NOTHING downstream: no
  # artifacts, no hardware lane waits on it. It still gates the release
  # with everything else (release.yml fires only on a fully green run);
  # splitting it out just means the riscv boards do not idle behind an
  # msan suite (needs: can only reference whole jobs, never single
  # matrix legs, so unblocking the boards required two jobs).
  test:
    name: ${{ matrix.preset }}
    needs: [changes, images, environments]
    # environments ran (which needs changes and the images, succeeded
    # or skipped for lack of docker changes); never after a failed or
    # cancelled image build.
    if: ${{ !cancelled() && needs.environments.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native compiler cohort, oldest floor to newest.
          - { preset: linux-gcc14-cxx23, image: gcc14 }
          - { preset: linux-gcc16-cxx26, image: gcc16 }
          - { preset: linux-clang18-cxx20-libstdcxx, image: clang18 }
          - { preset: linux-clang20-cxx23, image: clang20 }
          - { preset: linux-clang22-cxx26, image: clang22 }
          # Execution-provider alternative (beman.execution).
          - { preset: linux-clang22-cxx26-beman, image: clang22 }
          # Sanitizers: one address, one memory (against the baked
          # msan-libc++), one thread on the other compiler family, and one
          # address lane at the matrix's other optimisation level, since an
          # optimiser-dependent defect only exists under the optimiser that
          # made it.
          - { preset: linux-clang22-cxx26-asan, image: clang22 }
          - { preset: linux-clang22-cxx26-asan-release, image: clang22 }
          - { preset: linux-clang22-cxx26-msan, image: clang22 }
          - { preset: linux-gcc16-cxx26-tsan, image: gcc16 }
          # The differential fuzz harness, whose ctest leg is a short pass
          # of it. Its lane is the libstdc++ C++23 one, which is what
          # libFuzzer's runtime links against.
          - { preset: linux-clang22-cxx23-fuzzer, image: clang22 }
          # Coverage: LLVM source-based, the report (summary, lcov, html)
          # is written by tools/ci-test.sh and uploaded below. The SDE
          # pass runs instrumented too, so the AVX-512 kernel counts.
          - { preset: linux-clang22-cxx26-coverage, image: clang22 }
          # The gcov lanes are what release.yml merges into the cross-
          # platform total (one instrumentation model, so their line sets
          # agree): x86 plus every cross, each through its qemu matrix.
          - { preset: linux-gcc16-cxx26-coverage, image: gcc16 }
          - { preset: linux-arm64-gcc15-cxx23-coverage, image: arm64-gcc15 }
          - { preset: linux-riscv64-gcc15-cxx23-coverage, image: riscv64-gcc15 }
          - { preset: linux-ppc64le-gcc15-cxx23-coverage, image: ppc64le-gcc15 }
          - { preset: linux-s390x-gcc15-cxx23-coverage, image: s390x-gcc15 }
          # POWER and IBM z crosses, emulator-in-the-loop: vsx (POWER9+)
          # and the project's first BIG-ENDIAN lane, vxe (z14); qemu CPU
          # matrices live in tools/ci-test.sh.
          - { preset: linux-ppc64le-gcc15-cxx23, image: ppc64le-gcc15 }
          - { preset: linux-s390x-gcc15-cxx23, image: s390x-gcc15 }
          # MIPS cross, EMULATOR-ONLY in a stronger sense than the rest:
          # the others have hardware lanes or reachable silicon, and no
          # MSA machine is reachable at all. Every number this lane could
          # produce would be a qemu number, so it asserts digests only.
          # Its default qemu model has no MSA (dispatch must fall back to
          # scalar) and Loongson-3A4000 supplies it; see tools/ci-test.sh.
          - { preset: linux-mips64el-gcc14-cxx23, image: mips64el-gcc14 }
          # arm64 cross, emulator-in-the-loop (the SVE vector-length and
          # feature-off matrices live in tools/ci-test.sh; the aarch64
          # STATIC twin ships from the binaries job, feeding Neoverse).
          - { preset: linux-arm64-gcc15-cxx23, image: arm64-gcc15 }
    container:
      image: ghcr.io/${{ github.repository }}/toolchain-${{ matrix.image }}:${{ needs.changes.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Same as tools/tc and devcontainer.json runArgs: the sanitizer
      # runtimes need ptrace and an unfiltered seccomp profile.
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    env:
      CMAKE_GENERATOR: Ninja
      # The build driver (see the header): tools/ci-test.sh switches on
      # BLAKE3PP_CMAKE_RE. The TIPI_* and USER settings only matter to
      # cmake-re: the portable cmake-re must not provision tipi's distro,
      # its ranlib driver rewrites the archive in place (denied by the
      # remote sandbox), and goma wants a username.
      BLAKE3PP_CMAKE_RE: ${{ needs.changes.outputs.driver == 'cmake-re' && '1' || '0' }}
      BLAKE3PP_CMAKE_RE_FLAGS: ${{ needs.changes.outputs.cmake-re-mode == 'distributed' && '--host --distributed' || '--host' }}
      TIPI_DISTRO_MODE: none
      TIPI_DISABLE_AR_RANLIB_DRIVER: "ON"
      # tipi's own build cache needs a tipi.build account this CI has
      # not got, so every run ends in a failed upload. Read what is
      # there, publish nothing.
      TIPI_CACHE_CONSUME_ONLY: "ON"
      TIPI_CACHE_FORCE_ENABLE: "OFF"
      USER: runner
      # Mirrors tools/tc's sanitizer environment.
      ASAN_SYMBOLIZER_PATH: /usr/local/bin/llvm-symbolizer
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1:strict_string_checks=1:symbolize=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:report_error_type=1
      TSAN_OPTIONS: second_deadlock_stack=1:halt_on_error=0
      LSAN_OPTIONS: use_tls=0
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          cache-prefix: hfc-src2-linux-
      - uses: ./.github/actions/setup-cmake-re
        if: needs.changes.outputs.driver == 'cmake-re'
        with:
          preset: ${{ matrix.preset }}
          image-tag: ${{ needs.changes.outputs.tag }}
          rbe-service: ${{ secrets.RBE_SERVICE }}
          rbe-tls-client-auth-key: ${{ secrets.RBE_TLS_CLIENT_AUTH_KEY }}
          rbe-tls-client-auth-cert: ${{ secrets.RBE_TLS_CLIENT_AUTH_CERT }}
          env-registry: ${{ vars.BLAKE3PP_RBE_ENV_REGISTRY }}
          distributed: ${{ needs.changes.outputs.cmake-re-mode == 'distributed' }}

      - name: Configure, build, test (full emulator matrix)
        run: bash tools/ci-test.sh ${{ matrix.preset }}
      - name: Upload coverage report
        if: contains(matrix.preset, 'coverage')
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.preset }}
          retention-days: 14
          path: |
            build/${{ matrix.preset }}/coverage/summary.txt
            build/${{ matrix.preset }}/coverage/coverage.lcov
            build/${{ matrix.preset }}/coverage/html/

  # WebAssembly, tested in node and SHIPPED (the node-runnable js+wasm
  # pairs and the browser module, in the release). Its own job rather
  # than a `binaries` leg, so the Cloud-V boards never wait on an
  # unrelated wasm build.
  wasm:
    needs: [changes, images, environments]
    if: ${{ !cancelled() && needs.environments.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}/toolchain-emscripten:${{ needs.changes.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CMAKE_GENERATOR: Ninja
      # The build driver (see the header) and cmake-re's process settings.
      BLAKE3PP_CMAKE_RE: ${{ needs.changes.outputs.driver == 'cmake-re' && '1' || '0' }}
      BLAKE3PP_CMAKE_RE_FLAGS: ${{ needs.changes.outputs.cmake-re-mode == 'distributed' && '--host --distributed' || '--host' }}
      TIPI_DISTRO_MODE: none
      TIPI_DISABLE_AR_RANLIB_DRIVER: "ON"
      # tipi's own build cache needs a tipi.build account this CI has
      # not got, so every run ends in a failed upload. Read what is
      # there, publish nothing.
      TIPI_CACHE_CONSUME_ONLY: "ON"
      TIPI_CACHE_FORCE_ENABLE: "OFF"
      USER: runner
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          cache-prefix: hfc-src2-linux-
      - uses: ./.github/actions/setup-cmake-re
        if: needs.changes.outputs.driver == 'cmake-re'
        with:
          preset: wasm32-emcc-cxx23
          image-tag: ${{ needs.changes.outputs.tag }}
          rbe-service: ${{ secrets.RBE_SERVICE }}
          rbe-tls-client-auth-key: ${{ secrets.RBE_TLS_CLIENT_AUTH_KEY }}
          rbe-tls-client-auth-cert: ${{ secrets.RBE_TLS_CLIENT_AUTH_CERT }}
          env-registry: ${{ vars.BLAKE3PP_RBE_ENV_REGISTRY }}
          distributed: ${{ needs.changes.outputs.cmake-re-mode == 'distributed' }}
      - name: Configure, build, test (node)
        run: bash tools/ci-test.sh wasm32-emcc-cxx23
      # The container shares the runner's CPU, so this benches v8's
      # SIMD128 JIT on real x86 silicon, the same logic that lets the
      # x86_64 static leg bench in place. Upstream BLAKE3 has no wasm
      # SIMD kernel, so the reference rows double as the story.
      - name: Bench report (wasm under node, runner x86_64 silicon)
        run: |
          { echo "== wasm32-simd128, node on the GitHub ubuntu-latest runner =="
            grep -m1 "model name" /proc/cpuinfo || true
            node --version
            node build/wasm32-emcc-cxx23/cli/blake3ppsum.js --version < /dev/null
            node build/wasm32-emcc-cxx23/bench/blake3pp_bench.js --reps 1 --cooldown 0
          } | tee bench-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-report-wasm32
          path: bench-report.txt
          retention-days: 7
      - name: Upload tool binaries
        uses: actions/upload-artifact@v7
        with:
          name: tool-binaries-wasm32
          retention-days: 3
          path: |
            build/wasm32-emcc-cxx23/cli/blake3ppsum.js
            build/wasm32-emcc-cxx23/cli/blake3ppsum.wasm
            build/wasm32-emcc-cxx23/cli/blake3ppgen.js
            build/wasm32-emcc-cxx23/cli/blake3ppgen.wasm
            build/wasm32-emcc-cxx23/bench/blake3pp_bench.js
            build/wasm32-emcc-cxx23/bench/blake3pp_bench.wasm
            build/wasm32-emcc-cxx23/bench/blake3pp_bench_file.js
            build/wasm32-emcc-cxx23/bench/blake3pp_bench_file.wasm
            build/wasm32-emcc-cxx23/web/blake3pp-web-simd128.mjs
            build/wasm32-emcc-cxx23/web/blake3pp-web-simd128.wasm

  # The legs whose OUTPUTS ship or meet hardware: the five static musl
  # release chains and the riscv64 gcc cross job (full RVV qemu matrix
  # plus the freestanding xthead verifier the Pioneer executes). This
  # job, not the validation matrix above, is what the hardware lanes
  # wait on (Cloud-V boards, Neoverse): scarce serialized board time
  # starts as soon as the bytes it will run are built and
  # emulator-proven, without idling behind sanitizer suites. `artifact`
  # names the static-binaries-* upload; legs without one upload no
  # static binaries.
  binaries:
    name: ${{ matrix.preset }}
    needs: [changes, images, environments]
    if: ${{ !cancelled() && needs.environments.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-riscv64-gcc15-cxx23, image: riscv64-gcc15 }
          - { preset: linux-zigmusl-cxx23-static, image: zig, artifact: x86_64 }
          - { preset: linux-arm64-zigmusl-cxx23-static, image: zig, artifact: aarch64 }
          - { preset: linux-riscv64-zigmusl-cxx23-static, image: zig, artifact: riscv64 }
          # POWER and IBM z static musl: shipped release archives.
          # No hardware lane exists for them (yet): the bytes are
          # emulator-tested here and flagged as such in the notes.
          - { preset: linux-ppc64le-zigmusl-cxx23-static, image: zig, artifact: ppc64le }
          - { preset: linux-s390x-zigmusl-cxx23-static, image: zig, artifact: s390x }
          # LoongArch static musl, EMULATOR-ONLY: qemu-loongarch64 runs
          # the whole suite at three capability levels (both vector
          # units, LSX only, none; see tools/ci-test.sh), and no
          # LoongArch silicon is reachable to run it on.
          - { preset: linux-loongarch64-zigmusl-cxx23-static, image: zig, artifact: loongarch64 }
          # MIPS static: GCC rather than zig, because clang's MIPS backend
          # emits no MSA from the kernel's vector code (measured: zero
          # against GCC's 3514). Static glibc rather than musl for the same
          # reason. No MSA silicon exists to test it on, ever.
          - { preset: linux-mips64el-gcc14-cxx23-static, image: mips64el-gcc14, artifact: mips64el }
    container:
      image: ghcr.io/${{ github.repository }}/toolchain-${{ matrix.image }}:${{ needs.changes.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CMAKE_GENERATOR: Ninja
      # The build driver (see the header) and cmake-re's process settings.
      BLAKE3PP_CMAKE_RE: ${{ needs.changes.outputs.driver == 'cmake-re' && '1' || '0' }}
      BLAKE3PP_CMAKE_RE_FLAGS: ${{ needs.changes.outputs.cmake-re-mode == 'distributed' && '--host --distributed' || '--host' }}
      TIPI_DISTRO_MODE: none
      TIPI_DISABLE_AR_RANLIB_DRIVER: "ON"
      # tipi's own build cache needs a tipi.build account this CI has
      # not got, so every run ends in a failed upload. Read what is
      # there, publish nothing.
      TIPI_CACHE_CONSUME_ONLY: "ON"
      TIPI_CACHE_FORCE_ENABLE: "OFF"
      USER: runner
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          cache-prefix: hfc-src2-linux-
      - uses: ./.github/actions/setup-cmake-re
        if: needs.changes.outputs.driver == 'cmake-re'
        with:
          preset: ${{ matrix.preset }}
          image-tag: ${{ needs.changes.outputs.tag }}
          rbe-service: ${{ secrets.RBE_SERVICE }}
          rbe-tls-client-auth-key: ${{ secrets.RBE_TLS_CLIENT_AUTH_KEY }}
          rbe-tls-client-auth-cert: ${{ secrets.RBE_TLS_CLIENT_AUTH_CERT }}
          env-registry: ${{ vars.BLAKE3PP_RBE_ENV_REGISTRY }}
          distributed: ${{ needs.changes.outputs.cmake-re-mode == 'distributed' }}

      - name: Configure, build, test (full emulator matrix)
        run: bash tools/ci-test.sh ${{ matrix.preset }}

      # The container shares the runner's CPU, so the x86_64 static build
      # can bench right here, one of the hardware reports release.yml
      # appends to the prerelease notes.
      - name: Bench report (runner x86_64 silicon)
        if: matrix.preset == 'linux-zigmusl-cxx23-static'
        run: |
          { echo "== x86_64, GitHub ubuntu-latest runner, static musl build =="
            grep -m1 "model name" /proc/cpuinfo || true
            build/${{ matrix.preset }}/cli/blake3ppsum --version < /dev/null
            build/${{ matrix.preset }}/bench/blake3pp_bench --reps 1 --cooldown 0
          } | tee bench-report.txt
      - uses: actions/upload-artifact@v7
        if: matrix.preset == 'linux-zigmusl-cxx23-static'
        with:
          name: bench-report-x86_64
          path: bench-report.txt
          retention-days: 7
      # Static tool binaries for release.yml to package; the release
      # never rebuilds what ci already built and tested.
      - name: Upload static binaries
        if: matrix.artifact
        uses: actions/upload-artifact@v7
        with:
          name: static-binaries-${{ matrix.artifact }}
          retention-days: 3
          # The tests binary rides along for the hardware jobs (Cloud-V
          # boards run it natively); release packaging ignores it.
          path: |
            build/${{ matrix.preset }}/tests/blake3pp_tests
            build/${{ matrix.preset }}/cli/blake3ppsum
            build/${{ matrix.preset }}/cli/blake3ppgen
            build/${{ matrix.preset }}/bench/blake3pp_bench
            build/${{ matrix.preset }}/bench/blake3pp_bench_file
      # The freestanding xthead verifier from the gcc cross job; the
      # Pioneer runs it on real 0.7.1 silicon (no libc, runs anywhere).
      - name: Upload xthead verifier
        if: matrix.preset == 'linux-riscv64-gcc15-cxx23'
        uses: actions/upload-artifact@v7
        with:
          name: xthead-verify
          retention-days: 3
          path: build/xthead-verify/xthead_verify

  # FreeBSD amd64, cross-built here and RUN in a qemu guest in the job
  # below. The only lane in this file whose target OS cannot be
  # emulated at the process level: there is no qemu-user persona for a
  # FreeBSD userland the way there is for aarch64 or riscv64 Linux, so
  # a whole machine is the smallest unit that can execute these bytes.
  #
  # The build half is the `binaries` job with one preset and no ctest.
  # ctest is skipped rather than configured away because the toolchain
  # leaves CMAKE_CROSSCOMPILING_EMULATOR empty on purpose (see
  # cmake/toolchains/freebsd-zig-cxx23/): nothing here can run the
  # tests, the guest below can, and a ctest that silently ran zero
  # tests would look exactly like a ctest that passed.
  #
  # zig links this target DYNAMICALLY and will not do otherwise ("libc
  # of the specified target requires dynamic linking"), so unlike the
  # musl legs these binaries are not self-contained; the ABI version in
  # the triple, FreeBSD 14.0, is what they require of the guest.
  freebsd-build:
    name: freebsd-zig-cxx23 (cross build)
    needs: [changes, images, environments]
    if: ${{ !cancelled() && needs.environments.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}/toolchain-zig:${{ needs.changes.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # The image's /bin/sh is dash, and these steps are written for bash.
    defaults:
      run:
        shell: bash
    env:
      CMAKE_GENERATOR: Ninja
      # The build driver (see the header) and cmake-re's process settings.
      BLAKE3PP_CMAKE_RE: ${{ needs.changes.outputs.driver == 'cmake-re' && '1' || '0' }}
      BLAKE3PP_CMAKE_RE_FLAGS: ${{ needs.changes.outputs.cmake-re-mode == 'distributed' && '--host --distributed' || '--host' }}
      TIPI_DISTRO_MODE: none
      TIPI_DISABLE_AR_RANLIB_DRIVER: "ON"
      # tipi's own build cache needs a tipi.build account this CI has
      # not got, so every run ends in a failed upload. Read what is
      # there, publish nothing.
      TIPI_CACHE_CONSUME_ONLY: "ON"
      TIPI_CACHE_FORCE_ENABLE: "OFF"
      USER: runner
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          cache-prefix: hfc-src2-linux-
      - uses: ./.github/actions/setup-cmake-re
        if: needs.changes.outputs.driver == 'cmake-re'
        with:
          preset: freebsd-zig-cxx23
          image-tag: ${{ needs.changes.outputs.tag }}
          rbe-service: ${{ secrets.RBE_SERVICE }}
          rbe-tls-client-auth-key: ${{ secrets.RBE_TLS_CLIENT_AUTH_KEY }}
          rbe-tls-client-auth-cert: ${{ secrets.RBE_TLS_CLIENT_AUTH_CERT }}
          env-registry: ${{ vars.BLAKE3PP_RBE_ENV_REGISTRY }}
          distributed: ${{ needs.changes.outputs.cmake-re-mode == 'distributed' }}

      # The same two driver branches tools/ci-test.sh has, inline
      # because this lane wants its configure_and_build and not the
      # emulator matrix that follows it there.
      - name: Configure and build (cross, no ctest)
        run: |
          set -euo pipefail
          preset=freebsd-zig-cxx23
          if [ "${BLAKE3PP_CMAKE_RE}" = 1 ]; then
            flags=${BLAKE3PP_CMAKE_RE_FLAGS:---host}
            read -r -a args <<< "$(python3 tools/preset-args.py "${preset}")"
            # shellcheck disable=SC2086  # one flag per word, on purpose
            cmake-re ${flags} -S . "${args[@]}"
            cmake-re --build "build/${preset}" ${flags} -j"$(nproc)"
          else
            cmake --preset "${preset}"
            cmake --build "build/${preset}" -j"$(nproc)"
          fi
          file build/${preset}/cli/blake3ppsum

      # Before the upload, because 189 MB of debug info has to cross the
      # artifact store AND then the ssh pipe into the guest; stripped,
      # the same five binaries are under 10 MB. Same candidate loop as
      # the release job's packaging step, with plain GNU strip as the
      # last resort: the target is x86_64 ELF carrying a FreeBSD OSABI
      # byte, which BFD strips without caring which kernel it is for.
      # zig ships no stripper of its own (`zig objcopy --strip-all`
      # answers "unimplemented" on 0.17), which is why the zig image
      # installs binutils.
      - name: Strip the FreeBSD binaries
        run: |
          set -euo pipefail
          STRIP=""
          for c in llvm-strip llvm-strip-22 llvm-strip-20 llvm-strip-19 llvm-strip-18 strip; do
            if command -v "$c" > /dev/null 2>&1; then STRIP="$c"; break; fi
          done
          [ -n "$STRIP" ] || { echo "::error::no stripper in the zig image"; exit 1; }
          echo "stripping with ${STRIP}"
          d=build/freebsd-zig-cxx23
          "$STRIP" "$d"/tests/blake3pp_tests "$d"/cli/blake3ppsum "$d"/cli/blake3ppgen \
                   "$d"/bench/blake3pp_bench "$d"/bench/blake3pp_bench_file
          ls -l "$d"/tests/blake3pp_tests "$d"/cli/blake3ppsum "$d"/cli/blake3ppgen \
                "$d"/bench/blake3pp_bench "$d"/bench/blake3pp_bench_file

      - name: Upload FreeBSD binaries
        uses: actions/upload-artifact@v7
        with:
          name: freebsd-binaries-amd64
          retention-days: 3
          path: |
            build/freebsd-zig-cxx23/tests/blake3pp_tests
            build/freebsd-zig-cxx23/cli/blake3ppsum
            build/freebsd-zig-cxx23/cli/blake3ppgen
            build/freebsd-zig-cxx23/bench/blake3pp_bench
            build/freebsd-zig-cxx23/bench/blake3pp_bench_file

  # The other half: boot a real FreeBSD and run the bytes the job above
  # produced. The guest image is NOT built here. It is prepared once by
  # toolchains.yml (tools/freebsd-guest.sh prepare, which boots a stock
  # release image under KVM and lets FreeBSD configure its own UFS
  # root, because Linux cannot write UFS) and published to GHCR as
  # toolchain-freebsd-guest at the same content tag as every other
  # image in this run. So this job pulls a fixed, versioned guest
  # rather than rebuilding one, and the rebuild happens exactly when
  # tools/freebsd-guest.sh or the pinned release changes, since both
  # feed tools/toolchain-image-tag.sh.
  #
  # It runs on the HOST runner and not in that image: it needs /dev/kvm
  # for the guest and nbd plus mount on the host to hand the guest this
  # run's ssh key, none of which a job container has. The image is a
  # transport; `docker cp` takes the qcow2 out of it.
  #
  # What this proves that no other lane does: the POSIX-AIO-on-a-kqueue
  # engine and FreeBSD's O_DIRECT, on a real FreeBSD kernel, against
  # binaries built by a Linux container. Everything else about the
  # library is already covered; this is the I/O backend's only
  # non-emulated home.
  freebsd-test:
    name: freebsd-amd64 test+bench (qemu guest)
    needs: [changes, freebsd-build]
    # Same load-bearing pattern as neoverse-test-bench: the status
    # function breaks the transitive skip-poisoning from the (almost
    # always skipped) images job, which the implicit success() would
    # otherwise let veto this job despite a green direct need.
    if: ${{ !cancelled() && needs.freebsd-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # GitHub's x64 runners expose /dev/kvm, but the runner user is not
      # in the group that may open it. Without this the guest falls back
      # to TCG, where the test binary takes minutes instead of seconds
      # and the bench numbers mean nothing.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0660", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo usermod -aG kvm "$USER"
          ls -l /dev/kvm
      - name: Install qemu and the nbd tools
        run: |
          sudo apt-get update
          # No ovmf and no xz here: both belong to `prepare`, which ran
          # in toolchains.yml. This job boots an already-prepared image
          # under plain BIOS and reads it straight out of the qcow2,
          # whose compression is internal.
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
          sudo modprobe nbd max_part=16
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch the prepared guest image
        env:
          GUEST_IMAGE: ghcr.io/${{ github.repository }}/toolchain-freebsd-guest:${{ needs.changes.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p build/freebsd-guest
          t0=$(date +%s)
          docker pull "${GUEST_IMAGE}"
          echo "pull took $(( $(date +%s) - t0 ))s"
          # FROM scratch, so there is nothing to run in it; a container
          # is created only so that docker cp has something to copy out
          # of, and removed immediately.
          cid=$(docker create "${GUEST_IMAGE}" /nonexistent)
          docker cp "${cid}:/freebsd-guest.qcow2" build/freebsd-guest/freebsd-guest.qcow2
          docker rm "${cid}" > /dev/null
          ls -lh build/freebsd-guest/freebsd-guest.qcow2
          qemu-img info build/freebsd-guest/freebsd-guest.qcow2
      - uses: actions/download-artifact@v8
        with:
          name: freebsd-binaries-amd64
          path: freebsd-bin

      - name: Boot the guest
        run: |
          chmod +x freebsd-bin/tests/* freebsd-bin/cli/* freebsd-bin/bench/*
          sg kvm -c 'bash tools/freebsd-guest.sh start'
          sg kvm -c 'bash tools/freebsd-guest.sh wait'
      - name: What FreeBSD is this really
        run: |
          bash tools/freebsd-guest.sh run 'uname -a; sysctl -n hw.model hw.ncpu; df -h /'
      # Through `run`'s stdin rather than scp, so there is one ssh
      # configuration in this lane and not two.
      - name: Copy the binaries into the guest
        run: |
          tar cf - -C freebsd-bin . \
            | bash tools/freebsd-guest.sh run 'mkdir -p /root/b3 && tar xf - -C /root/b3 && chmod -R +x /root/b3 && ls -lR /root/b3'
      - name: Test on a real FreeBSD kernel
        run: bash tools/freebsd-guest.sh run 'cd /root/b3 && ./tests/blake3pp_tests'

      # The digest is the invariant; the I/O rungs are the variable. If
      # the AIO-on-kqueue reader, the O_DIRECT path, the synchronous
      # fallback and the single-threaded path ever disagree, one of them
      # is losing or reordering bytes, and that is a defect no unit test
      # on Linux can find.
      - name: Every I/O rung agrees on the digest
        run: |
          bash tools/freebsd-guest.sh run 'set -eu
            cd /root/b3
            ./cli/blake3ppgen --seed blake3pp-ci --length 256M --output /root/sample.bin
            a=$(./cli/blake3ppsum             /root/sample.bin | cut -d" " -f1)
            b=$(./cli/blake3ppsum --no-async  /root/sample.bin | cut -d" " -f1)
            c=$(./cli/blake3ppsum --no-direct /root/sample.bin | cut -d" " -f1)
            d=$(./cli/blake3ppsum --threads 1 /root/sample.bin | cut -d" " -f1)
            printf "default     %s\n--no-async  %s\n--no-direct %s\n--threads 1 %s\n" "$a" "$b" "$c" "$d"
            for x in "$b" "$c" "$d"; do
              [ "$x" = "$a" ] || { echo "::error::FreeBSD I/O rungs disagree on the digest"; exit 1; }
            done
            # And the generator round trip: bytes written through the
            # write pipeline, read back through the read pipeline.
            ./cli/blake3ppgen --seed roundtrip --length 64M --output /root/rt.bin
            e=$(./cli/blake3ppsum                       /root/rt.bin | cut -d" " -f1)
            f=$(./cli/blake3ppsum --no-direct --no-async /root/rt.bin | cut -d" " -f1)
            printf "roundtrip   %s\nroundtrip*  %s\n" "$e" "$f"
            [ "$e" = "$f" ] || { echo "::error::FreeBSD generator round trip disagrees"; exit 1; }
            echo "all rungs agree"'
      # Which rung actually ran, in the log, every run. blake3ppsum
      # --version reports the SIMD and execution providers; the I/O
      # backend is named by the tools that engage one, so both are
      # printed. Expect aio+direct: POSIX AIO on a kqueue, with
      # O_DIRECT.
      - name: Identity and the engaged I/O backend
        run: |
          bash tools/freebsd-guest.sh run 'cd /root/b3
            ./cli/blake3ppsum --version
            ./cli/blake3ppgen -v --seed probe --length 32M --output /root/probe.bin 2>&1 | tail -2
            ./bench/blake3pp_bench_file /root/sample.bin --reps 1 --cooldown 0 | head -8'

      - name: Bench report (FreeBSD amd64 under KVM on the runner)
        run: |
          { echo "== x86_64 FreeBSD, qemu/KVM guest on the GitHub ubuntu-latest runner, cross-built with zig =="
            bash tools/freebsd-guest.sh run 'uname -sr; sysctl -n hw.model; sysctl -n hw.ncpu'
            bash tools/freebsd-guest.sh run '/root/b3/cli/blake3ppsum --version'
            bash tools/freebsd-guest.sh run '/root/b3/bench/blake3pp_bench --reps 1 --cooldown 0'
          } | tee bench-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-report-freebsd-amd64
          path: bench-report.txt
          retention-days: 7

      # A guest that misbehaves is invisible from the host, so the
      # console is dumped whenever anything above failed. `wait` already
      # dumps it on its own timeout; this covers every later step.
      - name: Serial console
        if: failure()
        run: |
          echo "================ guest serial console ================"
          cat build/freebsd-guest/serial.log || echo "(no serial log)"
          echo "======================================================"
      - name: Stop the guest
        if: always()
        run: bash tools/freebsd-guest.sh stop || true

  # FreeBSD arm64: the same two-job shape as the amd64 pair above, and
  # the comments there apply here too. What is worth saying separately
  # is what this lane covers that nothing else in this file does. The
  # amd64 FreeBSD lane proves the POSIX-AIO-on-a-kqueue engine on a
  # foreign kernel; the Linux arm64 lanes prove the NEON and SVE kernels
  # on a Linux one. Only here do the two meet: SVE dispatch, through
  # FreeBSD's elf_aux_info auxv probe, on a FreeBSD kernel, from bytes a
  # Linux container cross-compiled. That probe (added in
  # src/dispatch/cpu_detect_arm.cpp) has no other automated home.
  freebsd-arm64-build:
    name: freebsd-arm64-zig-cxx23 (cross build)
    needs: [changes, images, environments]
    if: ${{ !cancelled() && needs.environments.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}/toolchain-zig:${{ needs.changes.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # The image's /bin/sh is dash, and these steps are written for bash.
    defaults:
      run:
        shell: bash
    env:
      CMAKE_GENERATOR: Ninja
      BLAKE3PP_CMAKE_RE: ${{ needs.changes.outputs.driver == 'cmake-re' && '1' || '0' }}
      BLAKE3PP_CMAKE_RE_FLAGS: ${{ needs.changes.outputs.cmake-re-mode == 'distributed' && '--host --distributed' || '--host' }}
      TIPI_DISTRO_MODE: none
      TIPI_DISABLE_AR_RANLIB_DRIVER: "ON"
      TIPI_CACHE_CONSUME_ONLY: "ON"
      TIPI_CACHE_FORCE_ENABLE: "OFF"
      USER: runner
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          cache-prefix: hfc-src2-linux-
      - uses: ./.github/actions/setup-cmake-re
        if: needs.changes.outputs.driver == 'cmake-re'
        with:
          preset: freebsd-arm64-zig-cxx23
          image-tag: ${{ needs.changes.outputs.tag }}
          rbe-service: ${{ secrets.RBE_SERVICE }}
          rbe-tls-client-auth-key: ${{ secrets.RBE_TLS_CLIENT_AUTH_KEY }}
          rbe-tls-client-auth-cert: ${{ secrets.RBE_TLS_CLIENT_AUTH_CERT }}
          env-registry: ${{ vars.BLAKE3PP_RBE_ENV_REGISTRY }}
          distributed: ${{ needs.changes.outputs.cmake-re-mode == 'distributed' }}

      - name: Configure and build (cross, no ctest)
        run: |
          set -euo pipefail
          preset=freebsd-arm64-zig-cxx23
          if [ "${BLAKE3PP_CMAKE_RE}" = 1 ]; then
            flags=${BLAKE3PP_CMAKE_RE_FLAGS:---host}
            read -r -a args <<< "$(python3 tools/preset-args.py "${preset}")"
            # shellcheck disable=SC2086  # one flag per word, on purpose
            cmake-re ${flags} -S . "${args[@]}"
            cmake-re --build "build/${preset}" ${flags} -j"$(nproc)"
          else
            cmake --preset "${preset}"
            cmake --build "build/${preset}" -j"$(nproc)"
          fi
          file build/${preset}/cli/blake3ppsum

      # Which kernels the probe actually registered, in the log, before
      # anything is shipped anywhere. cmake/KernelVariants.cmake decides
      # this from compiler probes rather than from a list, so the
      # honest way to assert "this build carries the arm64 kernels" is
      # to look at what it built. A silent drop to neon+scalar -- a
      # compiler that stopped accepting the -mcpu spelling, say -- would
      # otherwise sail through every later step, since dispatch would
      # simply select the best of what was there.
      - name: The arm64 kernels are in this build
        run: |
          set -euo pipefail
          d=build/freebsd-arm64-zig-cxx23
          missing=0
          for k in neon sve256 sve512 sve2_128; do
            if [ -d "$d/CMakeFiles/blake3pp_kernel_${k}.dir" ]; then
              echo "kernel ${k}: built"
            else
              echo "::error::the ${k} kernel was not registered for this build"
              missing=1
            fi
          done
          [ "$missing" = 0 ]

      # Before the upload, for the same reason as the amd64 lane: 189 MB
      # of debug info has to cross the artifact store AND then the ssh
      # pipe into the guest. The stripper candidates lead with the
      # aarch64 cross binutils, because the host `strip` in this image
      # is x86_64-only BFD and refuses an aarch64 object outright --
      # unlike the amd64 FreeBSD case, where the FreeBSD OSABI byte was
      # the only foreign thing about the file.
      - name: Strip the FreeBSD arm64 binaries
        run: |
          set -euo pipefail
          STRIP=""
          for c in aarch64-linux-gnu-strip llvm-strip llvm-strip-22 llvm-strip-20 llvm-strip-19 llvm-strip-18; do
            if command -v "$c" > /dev/null 2>&1; then STRIP="$c"; break; fi
          done
          [ -n "$STRIP" ] || { echo "::error::no aarch64-capable stripper in the zig image"; exit 1; }
          echo "stripping with ${STRIP}"
          d=build/freebsd-arm64-zig-cxx23
          "$STRIP" "$d"/tests/blake3pp_tests "$d"/cli/blake3ppsum "$d"/cli/blake3ppgen \
                   "$d"/bench/blake3pp_bench "$d"/bench/blake3pp_bench_file
          ls -l "$d"/tests/blake3pp_tests "$d"/cli/blake3ppsum "$d"/cli/blake3ppgen \
                "$d"/bench/blake3pp_bench "$d"/bench/blake3pp_bench_file

      - name: Upload FreeBSD arm64 binaries
        uses: actions/upload-artifact@v7
        with:
          name: freebsd-binaries-arm64
          retention-days: 3
          path: |
            build/freebsd-arm64-zig-cxx23/tests/blake3pp_tests
            build/freebsd-arm64-zig-cxx23/cli/blake3ppsum
            build/freebsd-arm64-zig-cxx23/cli/blake3ppgen
            build/freebsd-arm64-zig-cxx23/bench/blake3pp_bench
            build/freebsd-arm64-zig-cxx23/bench/blake3pp_bench_file

  # The arm64 guest. Everything the amd64 test job's header says about
  # where the image comes from holds here, with one substitution:
  # toolchain-freebsd-arm64-guest, prepared by the same
  # tools/freebsd-guest.sh with FBSD_ARCH=arm64.
  #
  # TCG, not KVM, and the honest reason is that there is no alternative:
  # GitHub exposes /dev/kvm on its x64 runners and on none of its arm64
  # ones, and an x64 host cannot KVM an aarch64 guest because KVM runs
  # guest instructions on the host CPU. So this lane TRANSLATES every
  # instruction, which is why its timeout is generous and its bench
  # numbers are explicitly not comparable to anything. Measured on
  # comparable hardware: ~2 min to boot, ~100 s for the suite. That is
  # affordable on every push, which is what it does -- the same call the
  # ppc64le and s390x qemu lanes make.
  #
  # The guest is pinned to a 15.x release where the amd64 one is pinned
  # to 14.x, and that is not an oversight: FreeBSD only began saving SVE
  # state across a context switch in 15.0, so a 14.x kernel sets no
  # HWCAP_SVE bit and dispatch correctly takes NEON. A 14.x guest would
  # test the ABI floor and none of the vector kernels. The floor is
  # still asserted -- these binaries declare FreeBSD 14.0 and nothing
  # about that changed -- it is just asserted by them loading.
  freebsd-arm64-test:
    name: freebsd-arm64 test+bench (qemu TCG guest)
    needs: [changes, freebsd-arm64-build]
    # Same load-bearing pattern as freebsd-test: the status function
    # breaks the transitive skip-poisoning from the (almost always
    # skipped) images job.
    if: ${{ !cancelled() && needs.freebsd-arm64-build.result == 'success' }}
    runs-on: ubuntu-latest
    # Generous: a TCG boot plus a TCG suite plus a TCG bench, on a
    # shared runner that may be busy.
    timeout-minutes: 90
    env:
      FBSD_ARCH: arm64
    steps:
      - uses: actions/checkout@v7
      # No "Enable KVM" step, unlike the amd64 lane: this guest does not
      # use it and could not.
      - name: Install qemu and the nbd tools
        run: |
          sudo apt-get update
          # qemu-system-arm carries qemu-system-aarch64. qemu-efi-aarch64
          # is NOT optional the way ovmf is for the amd64 lane: arm64 is
          # UEFI only, there is no BIOS fallback, so every boot needs the
          # AAVMF pair and not just the preparation boot.
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm qemu-utils qemu-efi-aarch64
          sudo modprobe nbd max_part=16
          ls -lL /usr/share/AAVMF/AAVMF_CODE.fd /usr/share/AAVMF/AAVMF_VARS.fd
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch the prepared guest image
        env:
          GUEST_IMAGE: ghcr.io/${{ github.repository }}/toolchain-freebsd-arm64-guest:${{ needs.changes.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p build/freebsd-arm64-guest
          t0=$(date +%s)
          docker pull "${GUEST_IMAGE}"
          echo "pull took $(( $(date +%s) - t0 ))s"
          # FROM scratch, so there is nothing to run in it; a container
          # is created only so that docker cp has something to copy out
          # of, and removed immediately. The payload path is the same
          # /freebsd-guest.qcow2 in both guest images; the tag above is
          # what says which architecture this one is.
          cid=$(docker create "${GUEST_IMAGE}" /nonexistent)
          docker cp "${cid}:/freebsd-guest.qcow2" build/freebsd-arm64-guest/freebsd-arm64-guest.qcow2
          docker rm "${cid}" > /dev/null
          ls -lh build/freebsd-arm64-guest/freebsd-arm64-guest.qcow2
          qemu-img info build/freebsd-arm64-guest/freebsd-arm64-guest.qcow2
      - uses: actions/download-artifact@v8
        with:
          name: freebsd-binaries-arm64
          path: freebsd-bin

      - name: Boot the guest
        run: |
          chmod +x freebsd-bin/tests/* freebsd-bin/cli/* freebsd-bin/bench/*
          t0=$(date +%s)
          bash tools/freebsd-guest.sh start
          bash tools/freebsd-guest.sh wait
          echo "boot took $(( $(date +%s) - t0 ))s (TCG)"
      - name: What FreeBSD is this really
        run: |
          bash tools/freebsd-guest.sh run 'uname -a; sysctl -n hw.model hw.ncpu; df -h /'
      - name: Copy the binaries into the guest
        run: |
          tar cf - -C freebsd-bin . \
            | bash tools/freebsd-guest.sh run 'mkdir -p /root/b3 && tar xf - -C /root/b3 && chmod -R +x /root/b3 && ls -lR /root/b3'
      - name: Test on a real FreeBSD kernel
        run: |
          t0=$(date +%s)
          bash tools/freebsd-guest.sh run 'cd /root/b3 && ./tests/blake3pp_tests'
          echo "suite took $(( $(date +%s) - t0 ))s (TCG)"

      # The coverage this lane exists for. tools/freebsd-guest.sh boots
      # the guest as a Neoverse N2, SVE2 at a 128-bit vector, so
      # FreeBSD's auxv probe should report SVE present and rdvl should
      # report 16 bytes, and dispatch should land on sve2_128. Asserting
      # it is what makes the setting load-bearing rather than decorative:
      # qemu already refuses an unknown -cpu property, so a RENAMED knob
      # fails the boot, and this catches a knob that is still accepted
      # but no longer does anything, as well as any regression in the
      # FreeBSD branch of the probe itself.
      - name: The engaged kernel is an SVE2 one
        run: |
          set -euo pipefail
          bash tools/freebsd-guest.sh run '/root/b3/cli/blake3ppsum --version' | tee version.txt
          sel=$(sed -n 's/.*(auto -> \(.*\))$/\1/p' version.txt | tail -1)
          echo "dispatch selected: ${sel}"
          case "${sel}" in
            sve2_*) echo "an SVE2 kernel, as the guest's CPU model promises" ;;
            *) echo "::error::expected an SVE2 kernel on this guest, got '${sel}'"; exit 1 ;;
          esac

      # The digest is the invariant; the I/O rungs are the variable. If
      # the AIO-on-kqueue reader, the O_DIRECT path, the synchronous
      # fallback and the single-threaded path ever disagree, one of them
      # is losing or reordering bytes, and that is a defect no unit test
      # on Linux can find. Smaller samples than the amd64 lane's,
      # because every byte of this is translated.
      - name: Every I/O rung agrees on the digest
        run: |
          bash tools/freebsd-guest.sh run 'set -eu
            cd /root/b3
            ./cli/blake3ppgen --seed blake3pp-ci --length 64M --output /root/sample.bin
            a=$(./cli/blake3ppsum             /root/sample.bin | cut -d" " -f1)
            b=$(./cli/blake3ppsum --no-async  /root/sample.bin | cut -d" " -f1)
            c=$(./cli/blake3ppsum --no-direct /root/sample.bin | cut -d" " -f1)
            d=$(./cli/blake3ppsum --threads 1 /root/sample.bin | cut -d" " -f1)
            printf "default     %s\n--no-async  %s\n--no-direct %s\n--threads 1 %s\n" "$a" "$b" "$c" "$d"
            for x in "$b" "$c" "$d"; do
              [ "$x" = "$a" ] || { echo "::error::FreeBSD arm64 I/O rungs disagree on the digest"; exit 1; }
            done
            # And the generator round trip: bytes written through the
            # write pipeline, read back through the read pipeline.
            ./cli/blake3ppgen --seed roundtrip --length 16M --output /root/rt.bin
            e=$(./cli/blake3ppsum                       /root/rt.bin | cut -d" " -f1)
            f=$(./cli/blake3ppsum --no-direct --no-async /root/rt.bin | cut -d" " -f1)
            printf "roundtrip   %s\nroundtrip*  %s\n" "$e" "$f"
            [ "$e" = "$f" ] || { echo "::error::FreeBSD arm64 generator round trip disagrees"; exit 1; }
            echo "all rungs agree"'
      # Which rung actually ran, in the log, every run. Expect
      # aio+direct: POSIX AIO on a kqueue, with O_DIRECT, exactly as on
      # the amd64 guest -- the I/O backend is chosen by the OS and knows
      # nothing about the instruction set, and this is where that claim
      # gets checked rather than assumed.
      - name: The engaged I/O backend
        run: |
          set -euo pipefail
          # Captured whole and grepped whole, then shown trimmed: the
          # rung's name must be found wherever a tool chose to print it,
          # not only in the last two lines a human wants to read.
          bash tools/freebsd-guest.sh run 'cd /root/b3
            ./cli/blake3ppgen -v --seed probe --length 8M --output /root/probe.bin
            ./bench/blake3pp_bench_file /root/sample.bin --reps 1 --cooldown 0' \
            > backend.txt 2>&1 || { cat backend.txt; exit 1; }
          head -12 backend.txt
          grep -q 'aio+direct' backend.txt \
            || { echo "::error::expected the aio+direct rung on FreeBSD arm64"; cat backend.txt; exit 1; }

      - name: Bench report (FreeBSD arm64 under TCG on the runner)
        run: |
          { echo "== aarch64 FreeBSD, qemu TCG guest on the GitHub ubuntu-latest runner, cross-built with zig =="
            echo "(TCG: every instruction is translated. These numbers measure the emulator, not the kernels.)"
            bash tools/freebsd-guest.sh run 'uname -sr; sysctl -n hw.model; sysctl -n hw.ncpu'
            bash tools/freebsd-guest.sh run '/root/b3/cli/blake3ppsum --version'
            bash tools/freebsd-guest.sh run '/root/b3/bench/blake3pp_bench --reps 1 --cooldown 0'
          } | tee bench-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-report-freebsd-arm64
          path: bench-report.txt
          retention-days: 7

      - name: Serial console
        if: failure()
        run: |
          echo "================ guest serial console ================"
          cat build/freebsd-arm64-guest/serial.log || echo "(no serial log)"
          echo "======================================================"
      - name: Stop the guest
        if: always()
        run: bash tools/freebsd-guest.sh stop || true

  # Windows, on the hosted runners; no toolchain image (those are Linux/
  # amd64); vswhere locates whatever VS the runner image ships and vcvars
  # provides cl/clang-cl/ninja. The x64 presets build and test natively;
  # the arm64 presets cross-build in the x64_arm64 environment
  # (compile-proven; x64 Windows cannot emulate arm64 binaries).
  windows:
    name: ${{ matrix.preset }}
    needs: changes
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Which presets run is decided in changes, since a matrix cannot
      # gate its own legs (see WINDOWS_MSVC there).
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.windows-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          cache-prefix: hfc-src2-win-
      - name: Ensure ninja
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
      - name: Configure, build${{ matrix.run_tests && ', test' || ' (cross, compile-proven only)' }}
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find VC\Auxiliary\Build\vcvarsall.bat`) do set "VCVARSALL=%%i"
          if not defined VCVARSALL (echo vswhere found no vcvarsall & exit /b 1)
          call "%VCVARSALL%" ${{ matrix.vcvars }} || exit /b 1
          cmake --preset ${{ matrix.preset }} || exit /b 1
          cmake --build build\${{ matrix.preset }} -j %NUMBER_OF_PROCESSORS% || exit /b 1
          if "${{ matrix.run_tests }}"=="true" ctest --test-dir build\${{ matrix.preset }} --output-on-failure
      # Full bench, one rep, per compiler: the MSVC-vs-clang kernel gap is
      # a running storyline; this gives it a longitudinal record for free.
      # pwsh step discipline (every pwsh step in this file): the strict
      # preamble makes the FIRST failing native command abort the step
      # with its name and exit code; GitHub's default wrapper only
      # propagates the LAST command's exit code, silently swallowing
      # everything before it. Tee-Object streams live output into the
      # log AND the report file, since Out-File buffering reads as a
      # stuck step while the bench runs.
      - name: Bench report (runner x64 silicon)
        if: matrix.run_tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          "== x86_64 Windows, ${{ matrix.preset }}, GitHub windows-latest runner ==" | Tee-Object bench-report.txt
          (Get-CimInstance Win32_Processor).Name | Tee-Object bench-report.txt -Append
          & "build\${{ matrix.preset }}\cli\blake3ppsum.exe" --version 2>&1 | Tee-Object bench-report.txt -Append
          & "build\${{ matrix.preset }}\bench\blake3pp_bench.exe" --reps 1 --cooldown 0 2>&1 | Tee-Object bench-report.txt -Append
      - uses: actions/upload-artifact@v7
        if: matrix.run_tests
        with:
          name: bench-report-${{ matrix.preset }}
          path: bench-report.txt
          retention-days: 7
      # PE-machine audit for the cross legs: cl.exe takes its TARGET
      # from the vcvars shell (clang-cl is pinned via -target), so a
      # shell-arch mixup would build x64 bytes that windows-11-arm runs
      # under TRANSPARENT x64 emulation: tests pass, just 5-10x slower.
      # Assert the architecture instead of trusting the shell.
      - name: PE machine audit (arm64 preset must emit ARM64)
        if: ${{ !matrix.run_tests }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          foreach ($d in 'cli', 'bench', 'tests') {
            Get-ChildItem "build\${{ matrix.preset }}\$d" -Filter *.exe | ForEach-Object {
              $b = [IO.File]::ReadAllBytes($_.FullName)
              $m = [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3C) + 4)
              Write-Host ("{0}: machine 0x{1:X4}" -f $_.Name, $m)
              if ($m -ne 0xAA64) { $bad += $_.Name }
            }
          }
          if ($bad) { throw "non-ARM64 PE in an arm64 preset: $bad" }
      # Reported, not fatal, for the reason audit_kernels in
      # tools/ci-test.sh gives: a finding is a judgement about code
      # generation, not a broken binary.
      - name: Kernel audit (each variant's object carries its ISA and nothing above it)
        shell: pwsh
        run: |
          python tools\objscan.py audit build\${{ matrix.preset }}
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning::${{ matrix.preset }}: kernel audit findings, see the log"
          }
      # Tool binaries for release.yml: both compilers on both
      # architectures (the msvc-vs-clangcl kernel gap makes shipping
      # both worthwhile). The arm64 zips are cross-built, natively
      # tested only when the windows-11-arm lane is enabled, and the
      # release notes flag exactly that.
      - name: Upload tool binaries
        if: matrix.upload
        uses: actions/upload-artifact@v7
        with:
          name: tool-binaries-${{ matrix.preset }}
          retention-days: 3
          # The tests binary rides along so the native-arm64 job can run
          # the oracle suite against exactly these bytes; the release
          # packaging copies only cli/bench and ignores it.
          path: |
            build/${{ matrix.preset }}/cli/blake3ppsum.exe
            build/${{ matrix.preset }}/cli/blake3ppgen.exe
            build/${{ matrix.preset }}/bench/blake3pp_bench.exe
            build/${{ matrix.preset }}/bench/blake3pp_bench_file.exe
            build/${{ matrix.preset }}/tests/blake3pp_tests.exe

  # macOS on the Apple-silicon macos-15 runners: Apple clang exercises
  # the GCD + F_NOCACHE I/O backend in CI and ships the macos release
  # artifact. The macos-clang22-cxx26 preset is deliberately NOT a lane:
  # the runner image preinstalls only Homebrew llvm@18, LLVM 22 would
  # cost a multi-minute bottle pour on the scarcest runner pool, and its
  # incremental coverage is thin: linux-clang22-cxx26 already tests the
  # same clang major/libc++/providers, and appleclang covers Darwin. The
  # preset stays for local use on a brewed Mac (brew install llvm@22);
  # re-adding the lane is one matrix line + an install step.
  macos:
    name: ${{ matrix.preset }}
    runs-on: macos-15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        preset: [macos-appleclang-cxx23]
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          cache-prefix: hfc-src2-mac-
      - name: Ensure ninja
        run: which ninja || brew install ninja
      - name: Configure, build, test
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build build/${{ matrix.preset }} -j"$(sysctl -n hw.ncpu)"
          ctest --test-dir build/${{ matrix.preset }} --output-on-failure
      # Reported, not fatal (see audit_kernels in tools/ci-test.sh).
      - name: Kernel audit (each variant's object carries its ISA and nothing above it)
        run: |
          python3 tools/objscan.py audit build/${{ matrix.preset }} \
            --binary build/${{ matrix.preset }}/cli/blake3ppsum \
            || echo "::warning::${{ matrix.preset }}: kernel audit findings, see the log"
      # Tool binaries for release.yml, from the appleclang build only: the
      # Homebrew-LLVM build rpaths its bundled libc++ under /opt/homebrew
      # and is not portable off a brewed machine.
      #
      # This runs BEFORE the bench report, so everything below measures and
      # exercises the binaries in the form they are actually shipped in. It
      # runs AFTER the kernel audit, which reads the symbols out of
      # blake3ppsum and needs them still there.
      - name: Strip the tool binaries
        if: matrix.preset == 'macos-appleclang-cxx23'
        run: strip -x build/${{ matrix.preset }}/cli/blake3ppsum build/${{ matrix.preset }}/cli/blake3ppgen build/${{ matrix.preset }}/bench/blake3pp_bench build/${{ matrix.preset }}/bench/blake3pp_bench_file
      - name: Bench report (Apple silicon)
        run: |
          { echo "== aarch64, GitHub macos-15 runner ($(sysctl -n machdep.cpu.brand_string)), ${{ matrix.preset }} =="
            echo "cores: $(sysctl -n hw.ncpu)"
            build/${{ matrix.preset }}/cli/blake3ppsum --version < /dev/null
            build/${{ matrix.preset }}/bench/blake3pp_bench --reps 1 --cooldown 0
          } | tee bench-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-report-${{ matrix.preset }}
          path: bench-report.txt
          retention-days: 7
      # Every binary is executed, in its uploaded form, in a mode that spins 
      # up the thread pool - which is where the allocator split aborts.
      - name: Exercise the remaining shipped tools
        if: matrix.preset == 'macos-appleclang-cxx23'
        run: |
          printf 'blake3pp' | build/${{ matrix.preset }}/cli/blake3ppsum
          build/${{ matrix.preset }}/cli/blake3ppgen --seed ci --length 8M --output "${RUNNER_TEMP}/smoke.bin"
          build/${{ matrix.preset }}/bench/blake3pp_bench_file "${RUNNER_TEMP}/smoke.bin" --reps 1 --cooldown 0 --no-direct
          rm -f "${RUNNER_TEMP}/smoke.bin"
      - uses: actions/upload-artifact@v7
        if: matrix.preset == 'macos-appleclang-cxx23'
        with:
          name: tool-binaries-macos-arm64
          retention-days: 3
          path: |
            build/${{ matrix.preset }}/cli/blake3ppsum
            build/${{ matrix.preset }}/cli/blake3ppgen
            build/${{ matrix.preset }}/bench/blake3pp_bench
            build/${{ matrix.preset }}/bench/blake3pp_bench_file

  # Native arm64 Windows testing on GitHub's windows-11-arm runners
  # (actions/runner-images Windows11-Arm64 image): runs the CROSS-BUILT
  # binaries (the Neoverse pattern) so the arm64 archives the release
  # ships are exactly the bytes tested here. OPT-IN via repository
  # variable WIN_ARM64_NATIVE=1: the label DOES serve this private repo
  # (observed 2026-08-30: a run completed on Cobalt 100 silicon), but
  # private-repo hosted minutes are BILLED, Windows ones at a premium,
  # so hardware lanes stay a deliberate opt-in rather than a default
  # spend. The first run (2026-08-30) reported the NEON kernel on this
  # Neoverse N2, which was a property of the build and not of the
  # platform: clang-cl accepts the SVE vector length only in its cc1
  # spelling, so until the probe learned that one, no SVE variant was
  # compiled in. Windows does report SVE through
  # IsProcessorFeaturePresent, and the same core now selects sve2_128,
  # measured at 1.81 GiB/s against neon's 1.31.
  windows-arm64-native:
    name: windows-arm64 native test (${{ matrix.preset }})
    needs: [changes, windows]
    # Status-function form for the same reason as the other hardware
    # lanes (see neoverse-test-bench): immune to transitive
    # skip-poisoning should this chain ever gain a skippable ancestor.
    if: ${{ !cancelled() && needs.windows.result == 'success' && vars.WIN_ARM64_NATIVE == '1' }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Only the presets the windows job actually built.
        preset: ${{ fromJSON(needs.changes.outputs.windows-arm64-matrix) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tool-binaries-${{ matrix.preset }}
      # One logical action per step from here on: when something fails,
      # the step NAME is the diagnosis (a chained block reports only
      # "exit code 1" with no culprit). The strict preamble in each pwsh
      # step aborts on the first failing native command and names it.
      - name: Show artifact layout
        shell: pwsh
        run: Get-ChildItem -Recurse -Name | Sort-Object
      # x64 bytes would RUN here (transparently emulated, 5-10x slow),
      # so prove these are arm64 before timing anything.
      - name: PE machine audit (downloaded binaries are ARM64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          Get-ChildItem -Recurse -Filter *.exe | ForEach-Object {
            $b = [IO.File]::ReadAllBytes($_.FullName)
            $m = [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3C) + 4)
            Write-Host ("{0}: machine 0x{1:X4}" -f $_.Name, $m)
            if ($m -ne 0xAA64) { $bad += $_.Name }
          }
          if ($bad) { throw "non-ARM64 PE downloaded onto the arm64 runner: $bad" }
      - name: CPU identity
        shell: pwsh
        run: (Get-CimInstance Win32_Processor).Name
      # Triage smoke: probe EVERY binary, not just the first (which
      # binaries crash discriminates hypotheses: the tests binary is the
      # only one not linking the tool allocator), then pull the Windows
      # Error Reporting events for any crash: faulting module + offset,
      # mappable to an instruction in a dumpbin disassembly.
      - name: Startup smoke (all binaries, crash triage)
        shell: pwsh
        run: |
          $failed = @()
          foreach ($probe in @(
              @{exe = 'cli\blake3ppsum.exe';       args = @('--version')},
              @{exe = 'cli\blake3ppgen.exe';       args = @('--help')},
              @{exe = 'bench\blake3pp_bench.exe';  args = @('--help')},
              @{exe = 'tests\blake3pp_tests.exe';  args = @('--version')})) {
            & $probe.exe @($probe.args) 2>&1 | ForEach-Object { "  $_" }
            $code = $LASTEXITCODE
            "{0} -> exit 0x{1:X8} ({1})" -f $probe.exe, $code
            if ($code -ne 0) { $failed += $probe.exe }
          }
          if ($failed) {
            Start-Sleep -Seconds 5  # let WER finish writing the event
            "== WER crash events =="
            Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000} -MaxEvents 5 -ErrorAction SilentlyContinue |
              ForEach-Object { $_.TimeCreated; $_.Message; '---' }
            throw "startup crash in: $failed"
          }
      - name: Test the cross-built binaries on real arm64 Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & "tests\blake3pp_tests.exe"
      # Tee-Object streams the bench live into the log while building
      # the report file; Out-File buffering read as a stuck step.
      - name: Bench report (arm64 Windows silicon)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          "== arm64 Windows, GitHub windows-11-arm runner, ${{ matrix.preset }} (cross-built) ==" | Tee-Object bench-report.txt
          (Get-CimInstance Win32_Processor).Name | Tee-Object bench-report.txt -Append
          & "cli\blake3ppsum.exe" --version 2>&1 | Tee-Object bench-report.txt -Append
          & "bench\blake3pp_bench.exe" --reps 1 --cooldown 0 2>&1 | Tee-Object bench-report.txt -Append
      - uses: actions/upload-artifact@v7
        with:
          name: bench-report-${{ matrix.preset }}-native
          path: bench-report.txt
          retention-days: 7

  # Real ARM silicon, no emulator and no native toolchain: GitHub's free
  # arm64 runners are Azure Cobalt 100: Neoverse N2, Armv9 SVE2 at
  # VL=128, exactly the sve2_128 kernel's target hardware. Runs the
  # cross-built static binaries: the full test suite (real-CPU dispatch
  # coverage, and the standing answer to "does the runner expose SVE?";
  # read the variants line), then a short indicative bench. Shared-runner
  # numbers are NOT measurements (thermal/noisy-neighbor caveats apply),
  # but a sve2_128-vs-neon ratio collapsing to 1.0 would still be a
  # regression signal.
  # OPT-IN via repository variable LINUX_ARM64_NATIVE=1: the arm64
  # labels serve this private repo (the windows-11-arm twin proved it on
  # real Cobalt silicon), but private-repo hosted minutes are billed;
  # hardware lanes are a deliberate opt-in spend, not a default.
  neoverse-test-bench:
    name: neoverse-n2 test+bench (real SVE2 silicon)
    needs: binaries
    # The !cancelled() + explicit result check is LOAD-BEARING, not
    # style: without a status function in the if, GitHub prepends an
    # implicit success() that fails when ANY TRANSITIVE ancestor was
    # skipped, and `images` is skipped on almost every run. The
    # !cancelled() override upstream protects only the job carrying it;
    # every descendant must break the cascade again. (This kept the
    # hardware lanes skipping for a day while vars, labels and direct
    # needs were all demonstrably correct.)
    if: ${{ !cancelled() && needs.binaries.result == 'success' && vars.LINUX_ARM64_NATIVE == '1' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: static-binaries-aarch64
      - name: What silicon is this really
        run: |
          chmod +x tests/blake3pp_tests cli/blake3ppsum cli/blake3ppgen bench/blake3pp_bench
          lscpu | grep -iE 'model name|flags' | cut -c1-200 || true
          cli/blake3ppsum --version
      - name: Test on real silicon
        run: tests/blake3pp_tests
      - name: Bench report (real SVE2 silicon)
        run: |
          { echo "== aarch64, GitHub ubuntu-24.04-arm (Azure Cobalt 100 / Neoverse N2), static musl build =="
            lscpu | grep -iE "model name|flags" | cut -c1-200 || true
            cli/blake3ppsum --version < /dev/null
            bench/blake3pp_bench --reps 1 --cooldown 0
          } | tee bench-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-report-neoverse-n2
          path: bench-report.txt
          retention-days: 7

  # RISC-V hardware validation across the Cloud-V board fleet
  # (https://cloud-v.co, runner docs: 10x-engineers.github.io/
  # riscv-ci-partners): one board per vector story, so the dispatch
  # matrix meets real silicon at every tier:
  #   visionfive2   JH7110      RV64GC, NO vector: the scalar fallback
  #   bpi-f3        SpacemiT K1 RVV 1.0 (VLEN=256): real rvv256
  #   milkv-pioneer SG2042      XTheadVector (draft 0.7.1), 64 cores
  # The boards BUILD NOTHING (the Neoverse pattern): they download the
  # ci-built static musl binaries (which run on any riscv64 Linux,
  # regardless of libc) plus, on the Pioneer, the freestanding
  # xthead_verify (no libc at all), so the hand-written 0.7.1 kernel is
  # exercised on the silicon it was written for. needs: binaries rather
  # than the wider validation matrix, so scarce, serialized board time
  # starts the moment its own bytes are built and emulator-proven,
  # without idling behind the sanitizer suites; those still gate the
  # RELEASE, just not the boards. (The musl bench carries no xthead
  # variant because clang cannot build it, so Pioneer bench rows are
  # scalar + the 64-core parallel engine; xthead BENCH numbers would
  # need a native gcc build, deliberately out of scope here.)
  # Gated on CLOUDV_RISCV64=1 (self-hosted labels queue forever when
  # unregistered, unlike hosted ones).
  riscv-boards:
    name: riscv64 ${{ matrix.board }} (Cloud-V)
    needs: binaries
    # Same load-bearing pattern as neoverse-test-bench above: the
    # status function breaks the transitive skip-poisoning from the
    # (almost always skipped) images job; the implicit success() would
    # veto this job regardless of the var and the green direct need.
    if: ${{ !cancelled() && needs.binaries.result == 'success' && vars.CLOUDV_RISCV64 == '1' }}
    runs-on: [self-hosted, "${{ matrix.board }}"]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { board: visionfive2, xthead: false }
          - { board: bpi-f3, xthead: false }
          - { board: milkv-pioneer, xthead: true }
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: static-binaries-riscv64
      - uses: actions/download-artifact@v8
        if: matrix.xthead
        with:
          name: xthead-verify
      - name: What silicon is this really
        run: |
          chmod +x tests/blake3pp_tests cli/blake3ppsum cli/blake3ppgen bench/blake3pp_bench bench/blake3pp_bench_file
          uname -a
          { lscpu | head -20; } 2>/dev/null || sort -u /proc/cpuinfo | head -20
          cli/blake3ppsum --version
      - name: Test the ci-built binaries on real silicon
        run: tests/blake3pp_tests
      - name: xthead oracle on real 0.7.1 silicon (freestanding verifier)
        if: matrix.xthead
        run: chmod +x xthead_verify && ./xthead_verify
      - name: Bench report (real RISC-V silicon)
        run: |
          { echo "== riscv64, Cloud-V ${{ matrix.board }}, ci-built static musl binaries =="
            { lscpu | head -20; } 2>/dev/null || sort -u /proc/cpuinfo | head -20
            cli/blake3ppsum --version < /dev/null
            bench/blake3pp_bench --reps 1 --cooldown 0
          } | tee bench-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-report-riscv64-${{ matrix.board }}
          path: bench-report.txt
          retention-days: 7
