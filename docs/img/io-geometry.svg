<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-label="Window size is a device property, not a CPU one">
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         fill: #24292f; }
  .axis { stroke: #8b949e; stroke-width: 1; }
  .grid { stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 2 3; }
  .muted { fill: #57606a; }
