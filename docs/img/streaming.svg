<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 444" width="860" height="444" role="img" aria-label="Streaming against the one-shot, on every core">
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         fill: #24292f; }
